<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0c3527" />
<title>BARILOCHE · Estadísticas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --felt: #0c3527; --felt-deep: #082019; --card: #f4ead6;
    --gold: #d8ad3f; --gold-soft: #f0d888;
    --cash: #2fae66; --virtual: #f2883c; --win: #3fbf72; --loss: #e2634f;
    --panel: #123f30; --panel-line: rgba(212,175,55,0.22);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--felt-deep); }
  body {
    font-family: 'Inter', sans-serif; color: var(--card);
    background: radial-gradient(ellipse at top, var(--panel) 0%, var(--felt) 45%, var(--felt-deep) 100%);
    min-height: 100vh;
  }
  .display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  header { border-bottom: 1px solid var(--panel-line); background: rgba(0,0,0,0.15); position: sticky; top: 0; z-index: 20; backdrop-filter: blur(6px); }
  .headerInner { max-width: 980px; margin: 0 auto; padding: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .brand .logo { font-size: 26px; color: var(--gold); line-height: 1; }
  .brand .sub { font-size: 10.5px; color: rgba(240,216,136,0.55); letter-spacing: 0.12em; text-transform: uppercase; }
  .navBtns { display: flex; gap: 6px; flex-shrink: 0; }
  .btn { display: inline-flex; align-items: center; gap: 5px; text-decoration: none; cursor: pointer; background: rgba(244,234,214,0.08); border: 1px solid var(--panel-line); border-radius: 8px; padding: 6px 10px; color: rgba(244,234,214,0.75); font-size: 11.5px; font-weight: 600; font-family: inherit; }
  .btn.err { background: rgba(200,80,70,0.18); border-color: rgba(200,80,70,0.4); color: #e6a79c; }
  .btn.active { background: var(--gold); color: #241d12; border-color: var(--gold); }
  main { max-width: 980px; margin: 0 auto; padding: 16px 14px 60px; display: grid; gap: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 14px; padding: 16px; }
  .sectionTitle { font-size: 19px; letter-spacing: 0.06em; color: var(--gold-soft); margin-bottom: 4px; }
  .sectionSub { font-size: 11.5px; color: rgba(244,234,214,0.5); margin-bottom: 12px; }
  .periodTag { display: inline-block; font-size: 10.5px; color: var(--gold-soft); background: rgba(216,173,63,0.14); border: 1px solid var(--panel-line); border-radius: 99px; padding: 2px 9px; margin-bottom: 10px; }
  .filterRow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .filterRow input[type="date"] { background: rgba(0,0,0,0.25); border: 1px solid var(--panel-line); border-radius: 8px; padding: 6px 8px; color: var(--card); font-family: inherit; font-size: 12px; }
  select { background: rgba(0,0,0,0.25); border: 1px solid var(--panel-line); border-radius: 8px; padding: 7px 9px; color: var(--card); font-family: inherit; font-size: 12.5px; }
  .kpiGrid { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; }
  @media (min-width: 640px) { .kpiGrid { grid-template-columns: repeat(4,1fr); } }
  .statCard { background: rgba(0,0,0,0.22); border-radius: 10px; padding: 12px 10px; min-width: 0; }
  .statCard .lbl { font-size: 10px; color: rgba(244,234,214,0.5); text-transform: uppercase; letter-spacing: 0.04em; }
  .statCard .val { font-size: 20px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .statCard .sub { font-size: 10.5px; color: rgba(244,234,214,0.5); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .statCard .sub.tone-win { color: var(--win); font-weight: 700; }
  .statCard .sub.tone-loss { color: var(--loss); font-weight: 700; }
  .statCard .sub.tone-gold { color: var(--gold-soft); font-weight: 700; }
  .statCard .sub.tone-cash { color: var(--cash); font-weight: 700; }
  .statCard .sub.tone-virtual { color: var(--virtual); font-weight: 700; }
  .tone-win { color: var(--win); } .tone-loss { color: var(--loss); } .tone-gold { color: var(--gold-soft); } .tone-cash { color: var(--cash); } .tone-virtual { color: var(--virtual); }
  .recordVal { font-size: 18px; margin-top: 2px; display: flex; align-items: center; gap: 6px; overflow: hidden; }
  .recordVal .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .avatar { width: 22px; height: 22px; border-radius: 99px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--gold); color: #241d12; font-weight: 800; font-size: 11px; }
  .empty { text-align: center; padding: 30px 10px; color: rgba(244,234,214,0.45); font-size: 13.5px; }
  .loading { text-align: center; padding: 60px 10px; color: var(--gold-soft); font-size: 22px; }
  .errBanner { font-size: 10px; color: rgba(230,167,156,0.9); padding: 0 14px 8px; max-width: 980px; margin: 0 auto; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; justify-content: center; }
  .legendItem { display: flex; align-items: center; gap: 5px; font-size: 11px; color: rgba(244,234,214,0.75); }
  .dot { width: 9px; height: 9px; border-radius: 99px; display: inline-block; flex-shrink: 0; }
  .volRow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .volLabel { width: 68px; flex-shrink: 0; font-size: 10.5px; color: rgba(244,234,214,0.55); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .volBarWrap { flex: 1; display: flex; height: 13px; border-radius: 4px; overflow: hidden; background: rgba(0,0,0,0.25); }
  .volSeg { display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: rgba(0,0,0,0.55); overflow: hidden; white-space: nowrap; }
  .volAmount { width: 120px; flex-shrink: 0; text-align: right; font-size: 10.5px; }
  table.simple { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.simple th, table.simple td { text-align: left; padding: 6px 8px; border-bottom: 1px solid rgba(244,234,214,0.08); white-space: nowrap; }
  .lockWrap { min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .lockCard { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 14px; padding: 24px; width: min(340px, 100%); text-align: center; }
  .lockCard .icon { font-size: 30px; margin-bottom: 8px; }
  .lockCard input { width: 100%; margin-top: 14px; background: rgba(0,0,0,0.25); border: 1px solid var(--panel-line); border-radius: 8px; padding: 10px 12px; color: var(--card); font-family: inherit; font-size: 14px; text-align: center; }
  .lockCard .lockBtn { margin-top: 12px; width: 100%; background: var(--gold); color: #241d12; border: none; border-radius: 8px; padding: 10px; font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit; }
  .lockCard .lockErr { color: var(--loss); font-size: 12px; margin-top: 8px; min-height: 16px; }
  table.simple .stickyCol { position: sticky; left: 0; background: var(--panel); z-index: 1; box-shadow: 2px 0 4px rgba(0,0,0,0.25); }
  table.simple th { color: rgba(244,234,214,0.5); font-weight: 600; font-size: 10px; text-transform: uppercase; }
  .tableWrap { overflow-x: auto; }
  .streakBadge { display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 99px; font-weight: 700; font-size: 10.5px; }
  .streakBadge.win { background: rgba(63,191,114,0.18); color: var(--win); }
  .streakBadge.loss { background: rgba(226,99,79,0.18); color: var(--loss); }
</style>
</head>
<body>
<header>
  <div class="headerInner">
    <div class="brand">
      <span class="logo display">BARILOCHE</span>
      <span class="sub">estadísticas</span>
    </div>
    <div class="navBtns">
      <a class="btn" href="./index.html">← App</a>
      <button class="btn" id="refreshBtn">⟳ Actualizar</button>
    </div>
  </div>
  <div class="errBanner" id="errBanner" style="display:none"></div>
</header>
<main id="main">
  <div class="loading">Cargando estadísticas…</div>
</main>

<script>
(function () {
  const money = (n) => "$" + Math.round(n || 0).toLocaleString("en-US", { maximumFractionDigits: 0 });
  const round1 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;
  const CAT_COLORS = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#3fae3f", "#9085e9", "#e66767", "#0fa0c2"];
  const MONTHS_ES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

  let ROSTER = [], GAMES = [];
  let period = "month"; // "all" | "year" | "month" | "range"
  let rangeFrom = "", rangeTo = "";
  let evoView = "table"; // "table" | "chart"  (tabla por default)
  let evoMetric = "balance"; // solo aplica cuando evoView === "chart"

  async function loadKey(key, fallback) {
    const res = await fetch("/api/store?key=" + encodeURIComponent(key));
    if (!res.ok) throw new Error("Error " + res.status + " al leer " + key);
    const data = await res.json();
    return data && data.value !== undefined && data.value !== null ? data.value : fallback;
  }

  // Motor de liquidación portado 1:1 desde netlify/functions/lib/settlement.js
  function computeSettlement(game, roster) {
    const players = game.playerIds.map((pid) => {
      const p = roster.find((r) => r.id === pid);
      const purchases = (game.purchases || []).filter((pu) => pu.playerId === pid);
      const cashAmount = purchases.filter((pu) => pu.type === "cash").reduce((s, pu) => s + pu.amount, 0);
      const virtualAmount = purchases.filter((pu) => pu.type === "virtual").reduce((s, pu) => s + pu.amount, 0);
      const totalBuyIn = cashAmount + virtualAmount;
      const cashOut = Number((game.finalChips || {})[pid]) || 0;
      const balance = round1(cashOut - totalBuyIn);
      return { playerId: pid, name: p ? p.name : "?", cashAmount, virtualAmount, totalBuyIn, cashOut, balance };
    });
    const totalCashAll = players.reduce((s, p) => s + p.cashAmount, 0);
    const rake = Math.min(game.rake || 0, totalCashAll);
    return { players, totalCashAll, rake };
  }

  function inPeriod(dateStr) {
    if (!dateStr) return false;
    if (period === "all") return true;
    if (period === "year") return dateStr.slice(0, 4) === String(new Date().getFullYear());
    if (period === "month") return dateStr.slice(0, 7) === new Date().toISOString().slice(0, 7);
    if (period === "range") {
      if (!rangeFrom && !rangeTo) return true;
      if (rangeFrom && dateStr < rangeFrom) return false;
      if (rangeTo && dateStr > rangeTo) return false;
      return true;
    }
    return true;
  }

  function periodLabel() {
    if (period === "all") return null;
    if (period === "month") { const d = new Date(); return MONTHS_ES[d.getMonth()] + " " + d.getFullYear(); }
    if (period === "year") return String(new Date().getFullYear());
    if (period === "range") {
      if (rangeFrom && rangeTo) return rangeFrom + " a " + rangeTo;
      if (rangeFrom) return "desde " + rangeFrom;
      if (rangeTo) return "hasta " + rangeTo;
      return "rango sin definir";
    }
    return null;
  }

  const ceilTo50 = (n) => Math.ceil((Number(n) || 0) / 50) * 50;

  function dinnerTotalForGame(game) {
    const d = game.dinner;
    if (!d) return 0;
    const numPlayers = (game.playerIds || []).length || 1;
    const sidesFee = d.sidesFee || 0;
    return (game.playerIds || []).reduce((s, pid) => {
      const alcohol = !!(d.alcohol && d.alcohol[pid]);
      return s + ceilTo50(d.total / numPlayers + sidesFee + d.waiter + (alcohol ? d.alcoholFee : 0));
    }, 0);
  }

  function buildStats(roster, gamesAll) {
    const games = gamesAll.filter((g) => g.finished && inPeriod(g.date)).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));

    const byPlayer = {};
    roster.forEach((p) => {
      byPlayer[p.id] = {
        player: p, played: 0, wins: 0, losses: 0, ties: 0, totalBalance: 0, hostCount: 0,
        maxCashOut: 0, totalCashAmt: 0, totalVirtualAmt: 0, series: [],
        curType: null, curLen: 0, bestWinStreak: 0, bestLossStreak: 0,
      };
    });

    let bestNight = null, worstNight = null, highestCashOut = null;
    const perGameVolume = [];
    let totalCash = 0, totalVirtual = 0, totalPlayersSum = 0, totalDinner = 0;

    games.forEach((g) => {
      const r = computeSettlement(g, roster);
      const cashSum = r.players.reduce((s, p) => s + p.cashAmount, 0);
      const virtualSum = r.players.reduce((s, p) => s + p.virtualAmount, 0);
      totalCash += cashSum; totalVirtual += virtualSum; totalPlayersSum += g.playerIds.length;
      totalDinner += dinnerTotalForGame(g);
      perGameVolume.push({ date: g.date, id: g.id, cash: cashSum, virtual: virtualSum, playerCount: g.playerIds.length });

      r.players.forEach((p) => {
        const st = byPlayer[p.playerId];
        if (!st) return;
        st.played += 1;
        if (g.hostId === p.playerId) st.hostCount += 1;
        if (p.balance > 0) st.wins += 1;
        else if (p.balance < 0) st.losses += 1;
        else st.ties += 1;
        st.totalBalance = round1(st.totalBalance + p.balance);
        st.totalCashAmt += p.cashAmount;
        st.totalVirtualAmt += p.virtualAmount;
        st.series.push({ date: g.date, balance: p.balance, cumulative: 0 });
        if (p.cashOut > st.maxCashOut) st.maxCashOut = p.cashOut;

        if (!bestNight || p.balance > bestNight.balance) bestNight = { player: st.player, balance: p.balance, date: g.date };
        if (!worstNight || p.balance < worstNight.balance) worstNight = { player: st.player, balance: p.balance, date: g.date };
        if (!highestCashOut || p.cashOut > highestCashOut.amount) highestCashOut = { player: st.player, amount: p.cashOut, date: g.date };

        const outcome = p.balance > 0 ? "W" : p.balance < 0 ? "L" : "T";
        if (outcome === st.curType) st.curLen += 1;
        else { st.curType = outcome; st.curLen = 1; }
        if (outcome === "W") st.bestWinStreak = Math.max(st.bestWinStreak, st.curLen);
        if (outcome === "L") st.bestLossStreak = Math.max(st.bestLossStreak, st.curLen);
      });
    });

    Object.values(byPlayer).forEach((st) => {
      let acc = 0;
      st.series.forEach((pt) => { acc = round1(acc + pt.balance); pt.cumulative = acc; });
      st.winRate = st.played ? Math.round((st.wins / st.played) * 100) : 0;
      st.avgBalance = st.played ? round1(st.totalBalance / st.played) : 0;
      st.curStreakLabel = st.curType === "W" ? "🔥 " + st.curLen + "G" : st.curType === "L" ? "❄️ " + st.curLen + "P" : "—";
    });

    const leaderboard = Object.values(byPlayer).filter((st) => st.played > 0).sort((a, b) => b.totalBalance - a.totalBalance);
    const totalGames = games.length;
    const avgPot = totalGames ? round1((totalCash + totalVirtual) / totalGames) : 0;
    const avgPlayers = totalGames ? round1(totalPlayersSum / totalGames) : 0;
    const avgCash = totalGames ? round1(totalCash / totalGames) : 0;
    const avgVirtual = totalGames ? round1(totalVirtual / totalGames) : 0;
    const avgDinnerPerPlayer = avgPlayers ? round1(totalDinner / avgPlayers) : 0;
    const totalRake = games.reduce((s, g) => s + (computeSettlement(g, roster).rake || 0), 0);

    // Récords con posibles empates ("Varios")
    function topByField(field, minVal) {
      minVal = minVal === undefined ? 1 : minVal;
      const max = leaderboard.reduce((m, st) => Math.max(m, st[field]), 0);
      if (max < minVal) return { max: 0, players: [] };
      return { max, players: leaderboard.filter((st) => st[field] === max) };
    }
    const mostWins = topByField("wins");
    const mostLosses = topByField("losses");
    const bestStreak = topByField("bestWinStreak");
    const worstStreak = topByField("bestLossStreak");
    const mostHost = topByField("hostCount");

    return {
      leaderboard, totalGames, totalCash, totalVirtual, avgCash, avgVirtual, totalRake, avgPot, avgPlayers,
      totalDinner, avgDinnerPerPlayer,
      bestNight, worstNight, highestCashOut, mostWins, mostLosses, bestStreak, worstStreak, mostHost,
      perGameVolume, sortedGames: games,
    };
  }

  /* ---------- DOM helpers ---------- */
  function el(tag, attrs, children) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (attrs[k] === undefined || attrs[k] === null) continue; // evita setAttribute(k, "undefined")
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k === "onclick") e.addEventListener("click", attrs[k]);
      else if (k === "onchange") e.addEventListener("change", attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (children || []).forEach((c) => { if (c !== null && c !== undefined) e.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c); });
    return e;
  }

  function avatarEl(player, size) {
    size = size || 22;
    const av = player && player.avatar;
    const d = el("div", { class: "avatar" });
    d.style.width = size + "px"; d.style.height = size + "px";
    if (av && av.type === "icon" && av.value) {
      d.style.background = "rgba(216,173,63,0.18)"; d.style.fontSize = Math.round(size * 0.6) + "px"; d.textContent = av.value;
    } else if (av && av.type === "photo" && av.value) {
      d.style.background = "transparent"; d.style.overflow = "hidden";
      const img = el("img"); img.src = av.value; img.style.width = "100%"; img.style.height = "100%"; img.style.objectFit = "cover";
      d.appendChild(img);
    } else {
      d.textContent = ((player && player.name) || "?").slice(0, 1).toUpperCase();
    }
    return d;
  }

  function statCard(label, value, sub, tone) {
    const children = [el("div", { class: "lbl" }, [label]), el("div", { class: "val mono " + (tone ? "tone-" + tone : "") }, [String(value)])];
    if (sub) children.push(el("div", { class: "sub" }, [sub]));
    return el("div", { class: "statCard" }, children);
  }

  // Tarjeta de récord: nombre del jugador (con avatar) en tamaño grande, el
  // dato/monto en tamaño chico debajo — mismo patrón que las tarjetas de
  // "mejor/peor balance" del resumen general.
  function recordCard(label, nameNode, sub, tone) {
    return el("div", { class: "statCard" }, [
      el("div", { class: "lbl" }, [label]),
      el("div", { class: "recordVal" }, [nameNode]),
      el("div", { class: "sub " + (tone ? "tone-" + tone : "") }, [sub]),
    ]);
  }
  function playerNameNode(player) {
    return el("div", { style: "display:flex;align-items:center;gap:6px;min-width:0" }, [avatarEl(player, 20), el("span", { class: "nm" }, [player.name])]);
  }
  function variosNode() {
    return el("span", { class: "nm", style: "color:rgba(244,234,214,0.65)" }, ["Varios"]);
  }

  function svgLine(points, W, H, padL, padR, padT, padB, seriesArr, colorOf, yFormat) {
    const n = points;
    const allVals = seriesArr.reduce((acc, s) => acc.concat(s.values), [0]);
    const maxV = Math.max.apply(null, allVals.concat([1]));
    const minV = Math.min.apply(null, allVals.concat([0]));
    const range = maxV - minV || 1;
    const x = (i) => padL + (i / Math.max(1, n - 1)) * (W - padL - padR);
    const y = (v) => padT + (1 - (v - minV) / range) * (H - padT - padB);
    const svgNS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.style.width = "100%"; svg.style.minWidth = "480px"; svg.style.height = "auto"; svg.style.display = "block";
    function gline(x1, y1, x2, y2, opts) {
      const l = document.createElementNS(svgNS, "line");
      l.setAttribute("x1", x1); l.setAttribute("y1", y1); l.setAttribute("x2", x2); l.setAttribute("y2", y2);
      l.setAttribute("stroke", (opts && opts.stroke) || "rgba(244,234,214,0.25)");
      l.setAttribute("stroke-width", (opts && opts.width) || "1");
      if (opts && opts.dash) l.setAttribute("stroke-dasharray", opts.dash);
      return l;
    }
    function gtext(tx, ty, str) {
      const t = document.createElementNS(svgNS, "text");
      t.setAttribute("x", tx); t.setAttribute("y", ty); t.setAttribute("text-anchor", "end");
      t.setAttribute("font-size", "9"); t.setAttribute("fill", "rgba(244,234,214,0.45)"); t.setAttribute("font-family", "IBM Plex Mono, monospace");
      t.textContent = str;
      return t;
    }
    svg.appendChild(gline(padL, y(0), W - padR, y(0), { dash: "3,3" }));
    svg.appendChild(gtext(padL - 6, y(0) + 3, yFormat(0)));
    svg.appendChild(gtext(padL - 6, y(maxV) + 3, yFormat(maxV)));
    svg.appendChild(gtext(padL - 6, y(minV) + 3, yFormat(minV)));
    seriesArr.forEach((s, idx) => {
      const color = colorOf(idx);
      const pts = s.values.map((v, i) => x(i) + "," + y(v)).join(" ");
      const poly = document.createElementNS(svgNS, "polyline");
      poly.setAttribute("points", pts); poly.setAttribute("fill", "none"); poly.setAttribute("stroke", color);
      poly.setAttribute("stroke-width", "2"); poly.setAttribute("stroke-linejoin", "round"); poly.setAttribute("stroke-linecap", "round");
      svg.appendChild(poly);
      const lastV = s.values[s.values.length - 1];
      if (lastV !== undefined) {
        const c = document.createElementNS(svgNS, "circle");
        c.setAttribute("cx", x(s.values.length - 1)); c.setAttribute("cy", y(lastV)); c.setAttribute("r", "2.6"); c.setAttribute("fill", color);
        svg.appendChild(c);
      }
    });
    return svg;
  }

  /* ---------- Section builders ---------- */
  function periodTag() {
    const lbl = periodLabel();
    return lbl ? el("div", { class: "periodTag" }, ["Período: " + lbl]) : null;
  }

  function buildFilterPanel() {
    const panel = el("div", { class: "panel" }, [el("div", { class: "sectionTitle" }, ["Período"])]);
    const row = el("div", { class: "filterRow" });
    ["month", "year", "range", "all"].forEach((p) => {
      const label = p === "all" ? "Todo" : p === "month" ? "Este mes" : p === "year" ? "Este año" : "Rango";
      row.appendChild(el("button", { class: "btn" + (period === p ? " active" : ""), onclick: function () { period = p; renderAll(); } }, [label]));
    });
    if (period === "range") {
      row.appendChild(el("span", { style: "font-size:11px;color:rgba(244,234,214,0.5)" }, ["desde"]));
      row.appendChild(el("input", { type: "date", value: rangeFrom, onchange: function (e) { rangeFrom = e.target.value; renderAll(); } }));
      row.appendChild(el("span", { style: "font-size:11px;color:rgba(244,234,214,0.5)" }, ["hasta"]));
      row.appendChild(el("input", { type: "date", value: rangeTo, onchange: function (e) { rangeTo = e.target.value; renderAll(); } }));
    }
    panel.appendChild(row);
    return panel;
  }

  function subHeading(text) {
    return el("div", { style: "font-size:11px;font-weight:700;color:rgba(244,234,214,0.55);text-transform:uppercase;letter-spacing:0.05em;margin:10px 0 6px" }, [text]);
  }

  function buildKpiPanel(stats) {
    const header = [el("div", { class: "sectionTitle" }, ["Resumen general"])];
    const tag = periodTag();
    if (tag) header.push(tag);
    const panel = el("div", { class: "panel" }, header);

    const generalGrid = el("div", { class: "kpiGrid" });
    generalGrid.appendChild(statCard("Partidas jugadas", stats.totalGames));
    generalGrid.appendChild(statCard("Jugadores promedio/partida", stats.avgPlayers.toFixed(1)));
    generalGrid.appendChild(statCard("Rake acumulado", money(stats.totalRake), null, "gold"));
    if (stats.mostHost.players.length === 1) generalGrid.appendChild(statCard("👑 Más veces anfitrión", stats.mostHost.players[0].player.name, stats.mostHost.max + " veces"));
    else if (stats.mostHost.players.length > 1) generalGrid.appendChild(statCard("👑 Más veces anfitrión", "Varios", "con " + stats.mostHost.max + " veces"));
    panel.appendChild(generalGrid);

    panel.appendChild(subHeading("Cash"));
    const cashGrid = el("div", { class: "kpiGrid" });
    cashGrid.appendChild(statCard("Total cash en el período", money(stats.totalCash), null, "cash"));
    cashGrid.appendChild(statCard("Promedio cash en el período", money(stats.avgCash), null, "cash"));
    panel.appendChild(cashGrid);

    panel.appendChild(subHeading("Virtual"));
    const virtualGrid = el("div", { class: "kpiGrid" });
    virtualGrid.appendChild(statCard("Total virtual en el período", money(stats.totalVirtual), null, "virtual"));
    virtualGrid.appendChild(statCard("Promedio virtual en el período", money(stats.avgVirtual), null, "virtual"));
    panel.appendChild(virtualGrid);

    panel.appendChild(subHeading("Cash + Virtual"));
    const cvGrid = el("div", { class: "kpiGrid" });
    cvGrid.appendChild(statCard("Total Cash+Virtual", money(stats.totalCash + stats.totalVirtual)));
    cvGrid.appendChild(statCard("Cash+Virtual promedio", money(stats.avgPot)));
    panel.appendChild(cvGrid);

    return panel;
  }

  function moneyTone(n) { return n > 0 ? "win" : n < 0 ? "loss" : "gold"; }

  function buildRecordsPanel(stats) {
    const panel = el("div", { class: "panel" }, [el("div", { class: "sectionTitle" }, ["Récords históricos"])]);
    const grid = el("div", { class: "kpiGrid" });
    let any = false;

    if (stats.bestNight) { any = true; grid.appendChild(recordCard("Mejor noche", playerNameNode(stats.bestNight.player), (stats.bestNight.balance > 0 ? "+" : "") + money(stats.bestNight.balance) + " · " + stats.bestNight.date, moneyTone(stats.bestNight.balance))); }
    if (stats.worstNight) { any = true; grid.appendChild(recordCard("Peor noche", playerNameNode(stats.worstNight.player), money(stats.worstNight.balance) + " · " + stats.worstNight.date, moneyTone(stats.worstNight.balance))); }
    if (stats.highestCashOut) { any = true; grid.appendChild(recordCard("Mayor cash out", playerNameNode(stats.highestCashOut.player), money(stats.highestCashOut.amount) + " · " + stats.highestCashOut.date, moneyTone(stats.highestCashOut.amount))); }

    if (stats.mostWins.players.length === 1) { any = true; grid.appendChild(recordCard("📈 Más balances positivos", playerNameNode(stats.mostWins.players[0].player), stats.mostWins.max + " partidas ganadas", "win")); }
    else if (stats.mostWins.players.length > 1) { any = true; grid.appendChild(recordCard("📈 Más balances positivos", variosNode(), "Varios con " + stats.mostWins.max, "win")); }

    if (stats.mostLosses.players.length === 1) { any = true; grid.appendChild(recordCard("📉 Más balances negativos", playerNameNode(stats.mostLosses.players[0].player), stats.mostLosses.max + " partidas perdidas", "loss")); }
    else if (stats.mostLosses.players.length > 1) { any = true; grid.appendChild(recordCard("📉 Más balances negativos", variosNode(), "Varios con " + stats.mostLosses.max, "loss")); }

    if (stats.bestStreak.players.length === 1) { any = true; grid.appendChild(recordCard("🔥 Mejor racha", playerNameNode(stats.bestStreak.players[0].player), "🔥 " + stats.bestStreak.max + "G", "win")); }
    else if (stats.bestStreak.players.length > 1) { any = true; grid.appendChild(recordCard("🔥 Mejor racha", variosNode(), "🔥 Varios con " + stats.bestStreak.max + "G", "win")); }

    if (stats.worstStreak.players.length === 1) { any = true; grid.appendChild(recordCard("❄️ Peor racha", playerNameNode(stats.worstStreak.players[0].player), "❄️ " + stats.worstStreak.max + " perdidas seguidas", "loss")); }
    else if (stats.worstStreak.players.length > 1) { any = true; grid.appendChild(recordCard("❄️ Peor racha", variosNode(), "❄️ Varios con " + stats.worstStreak.max + "P", "loss")); }

    if (!any) { panel.appendChild(el("div", { class: "empty" }, ["Sin datos suficientes en este período."])); return panel; }
    panel.appendChild(grid);
    return panel;
  }

  function buildEvoPanel(stats) {
    const header = [el("div", { class: "sectionTitle" }, ["Evolución"])];
    const tag = periodTag();
    if (tag) header.push(tag);
    const panel = el("div", { class: "panel" }, header);

    const controls = el("div", { class: "filterRow", style: "margin-bottom:12px" });
    ["table", "chart"].forEach((v) => {
      controls.appendChild(el("button", { class: "btn" + (evoView === v ? " active" : ""), onclick: function () { evoView = v; renderAll(); } }, [v === "table" ? "Tabla" : "Gráfico"]));
    });
    if (evoView === "chart") {
      const metricSel = el("select", { onchange: function (e) { evoMetric = e.target.value; renderAll(); } }, [
        el("option", { value: "balance", selected: evoMetric === "balance" ? "selected" : undefined }, ["Balance acumulado"]),
        el("option", { value: "winrate", selected: evoMetric === "winrate" ? "selected" : undefined }, ["% de victorias"]),
        el("option", { value: "avg", selected: evoMetric === "avg" ? "selected" : undefined }, ["Promedio por partida"]),
      ]);
      metricSel.value = evoMetric; // refuerzo: fija el valor también como propiedad, no solo como atributo
      controls.appendChild(metricSel);
    }
    panel.appendChild(controls);

    const top = stats.leaderboard.slice(0, 8);
    if (stats.leaderboard.length === 0) { panel.appendChild(el("div", { class: "empty" }, ["Sin partidas en este período."])); return panel; }

    if (evoView === "table") {
      const table = el("table", { class: "simple" });
      table.appendChild(el("thead", {}, [el("tr", {}, [
        el("th", { class: "stickyCol" }, ["Jugador"]), el("th", {}, ["Partidas"]), el("th", {}, ["G/P"]), el("th", {}, ["% Efect."]),
        el("th", {}, ["Promedio"]), el("th", {}, ["Balance total"]), el("th", {}, ["Total cash"]), el("th", {}, ["Total virtual"]),
        el("th", {}, ["Total C+V"]), el("th", {}, ["Mejor cash out"]), el("th", {}, ["Anfitrión"]), el("th", {}, ["Racha"]),
      ])]));
      const tbody = el("tbody");
      stats.leaderboard.forEach(function (st) {
        tbody.appendChild(el("tr", {}, [
          el("td", { class: "stickyCol" }, [(function () { const w = el("div", { style: "display:flex;align-items:center;gap:6px" }, [avatarEl(st.player, 18), el("span", {}, [st.player.name])]); return w; })()]),
          el("td", { class: "mono" }, [String(st.played)]),
          el("td", { class: "mono" }, [st.wins + "/" + st.losses]),
          el("td", { class: "mono" }, [st.winRate + "%"]),
          el("td", { class: "mono" }, [money(st.avgBalance)]),
          el("td", { class: "mono", style: "color:" + (st.totalBalance >= 0 ? "var(--win)" : "var(--loss)") }, [(st.totalBalance > 0 ? "+" : "") + money(st.totalBalance)]),
          el("td", { class: "mono tone-cash" }, [money(st.totalCashAmt)]),
          el("td", { class: "mono tone-virtual" }, [money(st.totalVirtualAmt)]),
          el("td", { class: "mono" }, [money(st.totalCashAmt + st.totalVirtualAmt)]),
          el("td", { class: "mono" }, [money(st.maxCashOut)]),
          el("td", { class: "mono" }, ["x" + st.hostCount]),
          el("td", {}, [el("span", { class: "streakBadge " + (st.curType === "W" ? "win" : st.curType === "L" ? "loss" : "") }, [st.curStreakLabel])]),
        ]));
      });
      table.appendChild(tbody);
      panel.appendChild(el("div", { class: "tableWrap" }, [table]));
    } else {
      if (stats.sortedGames.length < 2) {
        panel.appendChild(el("div", { class: "empty" }, ["Se necesitan al menos 2 partidas en este período para graficar."]));
        return panel;
      }
      let seriesArr, yFormat;
      if (evoMetric === "balance") {
        seriesArr = top.map(function (st) { return { name: st.player.name, values: st.series.map(function (pt) { return pt.cumulative; }) }; });
        yFormat = money;
      } else if (evoMetric === "winrate") {
        seriesArr = top.map(function (st) {
          let w = 0, vals = [];
          st.series.forEach(function (pt, i) { if (pt.balance > 0) w++; vals.push(Math.round((w / (i + 1)) * 100)); });
          return { name: st.player.name, values: vals };
        });
        yFormat = function (v) { return Math.round(v) + "%"; };
      } else {
        seriesArr = top.map(function (st) {
          let acc = 0, vals = [];
          st.series.forEach(function (pt, i) { acc = round1(acc + pt.balance); vals.push(round1(acc / (i + 1))); });
          return { name: st.player.name, values: vals };
        });
        yFormat = money;
      }
      const n = Math.max.apply(null, seriesArr.map(function (s) { return s.values.length; }));
      const svg = svgLine(n, 640, 240, 44, 12, 14, 24, seriesArr, function (idx) { return CAT_COLORS[idx % CAT_COLORS.length]; }, yFormat);
      const wrap = el("div", { style: "overflow-x:auto" }, [svg]);
      const legend = el("div", { class: "legend" });
      top.forEach(function (st, idx) {
        legend.appendChild(el("div", { class: "legendItem" }, [
          (function () { const d = el("span", { class: "dot" }); d.style.background = CAT_COLORS[idx % CAT_COLORS.length]; return d; })(),
          el("span", {}, [st.player.name]),
        ]));
      });
      wrap.appendChild(legend);
      panel.appendChild(wrap);
    }
    return panel;
  }

  function buildVolumePanel(stats) {
    const panel = el("div", { class: "panel" }, [
      el("div", { class: "sectionTitle" }, ["Volumen por partida"]),
      el("div", { class: "sectionSub" }, ["Cash + virtual comprado en cada partida (sin rake). El número entre paréntesis es la cantidad de jugadores. A la derecha: total / promedio por jugador."]),
    ]);
    if (stats.perGameVolume.length === 0) { panel.appendChild(el("div", { class: "empty" }, ["Sin partidas en este período."])); return panel; }
    const maxVol = Math.max.apply(null, stats.perGameVolume.map(function (v) { return v.cash + v.virtual; }).concat([1]));
    stats.perGameVolume.forEach(function (v) {
      const total = v.cash + v.virtual;
      const avgPerPlayer = v.playerCount ? round1(total / v.playerCount) : 0;
      const cashPct = total > 0 ? Math.round((v.cash / total) * 100) : 0;
      const virtualPct = total > 0 ? 100 - cashPct : 0;
      const cashWidth = total > 0 ? (v.cash / maxVol) * 100 : 0;
      const virtualWidth = total > 0 ? (v.virtual / maxVol) * 100 : 0;
      const cashSeg = el("div", { class: "volSeg" }, [cashPct > 0 ? cashPct + "%" : ""]);
      cashSeg.style.width = cashWidth + "%"; cashSeg.style.background = "var(--cash)";
      const virtualSeg = el("div", { class: "volSeg" }, [virtualPct > 0 ? virtualPct + "%" : ""]);
      virtualSeg.style.width = virtualWidth + "%"; virtualSeg.style.background = "var(--virtual)";
      // fecha corta (sin año) para dejar lugar al "(N jugadores)"
      const shortDate = v.date && v.date.length >= 10 ? v.date.slice(5) : v.date;
      const row = el("div", { class: "volRow" }, [
        el("div", { class: "volLabel mono" }, [shortDate + " (" + v.playerCount + ")"]),
        el("div", { class: "volBarWrap" }, [cashSeg, virtualSeg]),
        el("div", { class: "volAmount mono" }, [money(total) + " / " + money(avgPerPlayer)]),
      ]);
      panel.appendChild(row);
    });
    const legend = el("div", { class: "legend" }, [
      el("div", { class: "legendItem" }, [(function () { const d = el("span", { class: "dot" }); d.style.background = "var(--cash)"; return d; })(), el("span", {}, ["Cash"])]),
      el("div", { class: "legendItem" }, [(function () { const d = el("span", { class: "dot" }); d.style.background = "var(--virtual)"; return d; })(), el("span", {}, ["Virtual"])]),
    ]);
    panel.appendChild(legend);
    return panel;
  }

  function renderAll() {
    const main = document.getElementById("main");
    main.innerHTML = "";
    main.appendChild(buildFilterPanel());
    const stats = buildStats(ROSTER, GAMES);
    if (stats.totalGames === 0) {
      main.appendChild(el("div", { class: "panel" }, [el("div", { class: "empty" }, ["No hay partidas terminadas en este período."])]));
      return;
    }
    main.appendChild(buildKpiPanel(stats));
    main.appendChild(buildRecordsPanel(stats));
    main.appendChild(buildEvoPanel(stats));
    main.appendChild(buildVolumePanel(stats));
  }

  function showLockScreen(mode, onSubmit) {
    // mode: "prompt" (pedir contraseña) | "noPassword" (no hay contraseña configurada)
    const main = document.getElementById("main");
    main.innerHTML = "";
    if (mode === "noPassword") {
      main.appendChild(el("div", { class: "lockWrap" }, [
        el("div", { class: "lockCard" }, [
          el("div", { class: "icon" }, ["🔒"]),
          el("div", { class: "display", style: "font-size:20px;color:var(--gold-soft)" }, ["Sin contraseña configurada"]),
          el("div", { style: "font-size:12.5px;color:rgba(244,234,214,0.6);margin-top:8px;line-height:1.5" }, [
            "Todavía no hay una contraseña de administrador en el Excel (hoja \"Meta\", fila con key=admin_password). Configurala desde la app para poder ver las estadísticas.",
          ]),
        ]),
      ]));
      return;
    }
    const input = el("input", { type: "password", placeholder: "Contraseña", autocomplete: "off" });
    const err = el("div", { class: "lockErr" });
    const submit = function () { onSubmit(input.value, err); };
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
    main.appendChild(el("div", { class: "lockWrap" }, [
      el("div", { class: "lockCard" }, [
        el("div", { class: "icon" }, ["🔒"]),
        el("div", { class: "display", style: "font-size:22px;color:var(--gold-soft)" }, ["Estadísticas protegidas"]),
        el("div", { style: "font-size:12.5px;color:rgba(244,234,214,0.6);margin-top:6px" }, ["Ingresá la contraseña de administrador para ver el dashboard."]),
        input,
        el("button", { class: "lockBtn", onclick: submit }, ["Entrar"]),
        err,
      ]),
    ]));
    input.focus();
  }

  async function init() {
    document.getElementById("main").innerHTML = '<div class="loading">Verificando acceso…</div>';
    let adminPassword = "";
    try {
      adminPassword = (await loadKey("poker-admin-password", "")) || "";
    } catch (e) {
      document.getElementById("main").innerHTML = "";
      document.getElementById("main").appendChild(el("div", { class: "panel" }, [el("div", { class: "empty" }, ["No se pudo verificar la contraseña: " + String((e && e.message) || e)])]));
      return;
    }
    if (!adminPassword) { showLockScreen("noPassword"); return; }
    showLockScreen("prompt", function (entered, errEl) {
      if (entered === adminPassword) { load(); }
      else { errEl.textContent = "Contraseña incorrecta."; }
    });
  }

  async function load() {
    const main = document.getElementById("main");
    main.innerHTML = '<div class="loading">Cargando estadísticas…</div>';
    const btn = document.getElementById("refreshBtn");
    const errBanner = document.getElementById("errBanner");
    btn.textContent = "⟳ Actualizando…";
    btn.classList.remove("err");
    errBanner.style.display = "none";
    try {
      const roster = await loadKey("poker-roster", []);
      const games = await loadKey("poker-games", []);
      ROSTER = roster || []; GAMES = games || [];
      renderAll();
      btn.textContent = "⟳ Actualizar";
    } catch (e) {
      btn.textContent = "⟳ Error";
      btn.classList.add("err");
      errBanner.textContent = String((e && e.message) || e);
      errBanner.style.display = "block";
      console.error(e);
    }
  }

  // El botón "Actualizar" del header solo tiene sentido una vez adentro
  // (después de pasar la contraseña); antes de eso, refresca la verificación.
  document.getElementById("refreshBtn").addEventListener("click", function () {
    if (ROSTER.length || GAMES.length) load();
    else init();
  });
  init();
})();
</script>
</body>
</html>
