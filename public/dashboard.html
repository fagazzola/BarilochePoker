<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0c3527" />
<title>BARILOCHE · Estadísticas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --felt: #0c3527; --felt-deep: #082019; --card: #f4ead6;
    --gold: #d8ad3f; --gold-soft: #f0d888;
    --cash: #2fae66; --virtual: #f2883c; --win: #3fbf72; --loss: #e2634f;
    --panel: #123f30; --panel-line: rgba(212,175,55,0.22);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--felt-deep); }
  body {
    font-family: 'Inter', sans-serif; color: var(--card);
    background: radial-gradient(ellipse at top, var(--panel) 0%, var(--felt) 45%, var(--felt-deep) 100%);
    min-height: 100vh;
  }
  .display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  header {
    border-bottom: 1px solid var(--panel-line); background: rgba(0,0,0,0.15);
    position: sticky; top: 0; z-index: 20; backdrop-filter: blur(6px);
  }
  .headerInner { max-width: 900px; margin: 0 auto; padding: 14px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .brand .logo { font-size: 26px; color: var(--gold); line-height: 1; }
  .brand .sub { font-size: 10.5px; color: rgba(240,216,136,0.55); letter-spacing: 0.12em; text-transform: uppercase; }
  .navBtns { display: flex; gap: 6px; flex-shrink: 0; }
  .btn {
    display: inline-flex; align-items: center; gap: 5px; text-decoration: none; cursor: pointer;
    background: rgba(244,234,214,0.08); border: 1px solid var(--panel-line); border-radius: 8px;
    padding: 6px 10px; color: rgba(244,234,214,0.75); font-size: 11.5px; font-weight: 600; font-family: inherit;
  }
  .btn.err { background: rgba(200,80,70,0.18); border-color: rgba(200,80,70,0.4); color: #e6a79c; }
  main { max-width: 900px; margin: 0 auto; padding: 16px 14px 60px; display: grid; gap: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 14px; padding: 16px; }
  .sectionTitle { font-size: 19px; letter-spacing: 0.06em; color: var(--gold-soft); margin-bottom: 12px; }
  .grid2 { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; }
  .statCard { background: rgba(0,0,0,0.22); border-radius: 10px; padding: 12px 10px; min-width: 0; }
  .statCard .lbl { font-size: 10.5px; color: rgba(244,234,214,0.5); text-transform: uppercase; letter-spacing: 0.04em; }
  .statCard .val { font-size: 22px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .statCard .sub { font-size: 11px; color: rgba(244,234,214,0.5); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tone-win { color: var(--win); } .tone-loss { color: var(--loss); } .tone-gold { color: var(--gold-soft); }
  .leaderRow { background: rgba(0,0,0,0.18); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .leaderTop { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .leaderName { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .avatar { width: 26px; height: 26px; border-radius: 99px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--gold); color: #241d12; font-weight: 800; font-size: 12px; }
  .barTrack { margin-top: 7px; height: 6px; border-radius: 99px; background: rgba(0,0,0,0.3); overflow: hidden; }
  .barFill { height: 100%; border-radius: 99px; }
  .metaRow { display: flex; gap: 12px; margin-top: 7px; flex-wrap: wrap; font-size: 11px; color: rgba(244,234,214,0.55); }
  .empty { text-align: center; padding: 30px 10px; color: rgba(244,234,214,0.45); font-size: 13.5px; }
  .loading { text-align: center; padding: 60px 10px; color: var(--gold-soft); font-size: 22px; }
  .errBanner { font-size: 10px; color: rgba(230,167,156,0.9); padding: 0 14px 8px; max-width: 900px; margin: 0 auto; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; justify-content: center; }
  .legendItem { display: flex; align-items: center; gap: 5px; font-size: 11px; color: rgba(244,234,214,0.75); }
  .dot { width: 9px; height: 9px; border-radius: 99px; display: inline-block; }
</style>
</head>
<body>
<header>
  <div class="headerInner">
    <div class="brand">
      <span class="logo display">BARILOCHE</span>
      <span class="sub">estadísticas</span>
    </div>
    <div class="navBtns">
      <a class="btn" href="./index.html">← App</a>
      <button class="btn" id="refreshBtn">⟳ Actualizar</button>
    </div>
  </div>
  <div class="errBanner" id="errBanner" style="display:none"></div>
</header>
<main id="main">
  <div class="loading">Cargando estadísticas…</div>
</main>

<script>
(function () {
  const money = (n) => "$" + Math.round(n || 0).toLocaleString("en-US", { maximumFractionDigits: 0 });
  const round1 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;
  const LINE_COLORS = ["#d8ad3f", "#3fbf72", "#f2883c", "#e2634f", "#4fb8e0", "#e08fc9", "#c9a24f", "#7fd9a8"];

  async function loadKey(key, fallback) {
    const res = await fetch("/api/store?key=" + encodeURIComponent(key));
    if (!res.ok) throw new Error("Error " + res.status + " al leer " + key);
    const data = await res.json();
    return data && data.value !== undefined && data.value !== null ? data.value : fallback;
  }

  // Mismo motor de liquidación que la app principal (src/App.jsx), para que
  // el balance de cada jugador coincida exactamente.
  function computeSettlement(game, roster) {
    const players = game.playerIds.map((pid) => {
      const p = roster.find((r) => r.id === pid);
      const purchases = (game.purchases || []).filter((pu) => pu.playerId === pid);
      const cashAmount = purchases.filter((pu) => pu.type === "cash").reduce((s, pu) => s + pu.amount, 0);
      const virtualAmount = purchases.filter((pu) => pu.type === "virtual").reduce((s, pu) => s + pu.amount, 0);
      const totalBuyIn = cashAmount + virtualAmount;
      const cashOut = Number((game.finalChips || {})[pid]) || 0;
      const balance = round1(cashOut - totalBuyIn);
      return { playerId: pid, name: p ? p.name : "?", cashAmount, virtualAmount, totalBuyIn, cashOut, balance };
    });
    const totalCashAll = players.reduce((s, p) => s + p.cashAmount, 0);
    return { players, totalCashAll };
  }

  function buildStats(roster, games) {
    const sorted = games.slice().sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    const byPlayer = {};
    roster.forEach((p) => {
      byPlayer[p.id] = { player: p, played: 0, wins: 0, losses: 0, ties: 0, totalBalance: 0, series: [] };
    });
    let biggestPot = null;
    sorted.forEach((g) => {
      if (!g.finished) return;
      const r = computeSettlement(g, roster);
      const pot = r.players.reduce((s, p) => s + p.totalBuyIn, 0);
      if (!biggestPot || pot > biggestPot.pot) biggestPot = { pot, date: g.date };
      r.players.forEach((p) => {
        const st = byPlayer[p.playerId];
        if (!st) return;
        st.played += 1;
        if (p.balance > 0) st.wins += 1;
        else if (p.balance < 0) st.losses += 1;
        else st.ties += 1;
        st.totalBalance = round1(st.totalBalance + p.balance);
        st.series.push({ date: g.date, balance: p.balance, cumulative: 0 });
      });
    });
    Object.values(byPlayer).forEach((st) => {
      let acc = 0;
      st.series.forEach((pt) => { acc = round1(acc + pt.balance); pt.cumulative = acc; });
      st.winRate = st.played ? Math.round((st.wins / st.played) * 100) : 0;
      st.avgBalance = st.played ? round1(st.totalBalance / st.played) : 0;
    });
    const leaderboard = Object.values(byPlayer).filter((st) => st.played > 0).sort((a, b) => b.totalBalance - a.totalBalance);
    const totalGames = sorted.filter((g) => g.finished).length;
    const totalCashMoved = sorted.filter((g) => g.finished).reduce((s, g) => s + computeSettlement(g, roster).totalCashAll, 0);
    const topWinner = leaderboard[0] || null;
    const topLoser = leaderboard.length ? leaderboard[leaderboard.length - 1] : null;
    const mostActive = leaderboard.slice().sort((a, b) => b.played - a.played)[0] || null;
    return { leaderboard, totalGames, totalCashMoved, biggestPot, topWinner, topLoser, mostActive, sortedGames: sorted.filter((g) => g.finished) };
  }

  function el(tag, attrs, children) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (children || []).forEach((c) => { if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }

  function avatarEl(player, size) {
    size = size || 26;
    const av = player && player.avatar;
    const d = el("div", { class: "avatar" });
    d.style.width = size + "px"; d.style.height = size + "px";
    if (av && av.type === "icon" && av.value) {
      d.style.background = "rgba(216,173,63,0.18)";
      d.style.fontSize = Math.round(size * 0.55) + "px";
      d.textContent = av.value;
    } else if (av && av.type === "photo" && av.value) {
      d.style.background = "transparent";
      d.style.overflow = "hidden";
      const img = el("img");
      img.src = av.value; img.style.width = "100%"; img.style.height = "100%"; img.style.objectFit = "cover";
      d.appendChild(img);
    } else {
      d.textContent = ((player && player.name) || "?").slice(0, 1).toUpperCase();
    }
    return d;
  }

  function statCard(label, value, sub, tone) {
    const v = el("div", { class: "val mono " + (tone ? "tone-" + tone : "") }, [String(value)]);
    const children = [el("div", { class: "lbl" }, [label]), v];
    if (sub) children.push(el("div", { class: "sub" }, [sub]));
    return el("div", { class: "statCard" }, children);
  }

  function leaderRow(st, rank, maxAbs) {
    const win = st.totalBalance > 0, flat = st.totalBalance === 0;
    const pct = maxAbs > 0 ? Math.min(100, Math.round((Math.abs(st.totalBalance) / maxAbs) * 100)) : 0;
    const top = el("div", { class: "leaderTop" }, [
      el("div", { class: "leaderName" }, [
        el("span", { class: "mono", style: "font-size:12px;color:rgba(244,234,214,0.4);width:18px;flex-shrink:0;display:inline-block" }, ["#" + rank]),
        avatarEl(st.player, 26),
        el("span", { style: "color:#f4ead6;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" }, [st.player.name]),
      ]),
      el("span", { class: "mono", style: "font-weight:800;font-size:14.5px;flex-shrink:0;color:" + (win ? "var(--win)" : flat ? "rgba(244,234,214,0.6)" : "var(--loss)") }, [(st.totalBalance > 0 ? "+" : "") + money(st.totalBalance)]),
    ]);
    const track = el("div", { class: "barTrack" }, [
      (function () { const f = el("div", { class: "barFill" }); f.style.width = pct + "%"; f.style.background = win ? "var(--win)" : flat ? "rgba(244,234,214,0.3)" : "var(--loss)"; return f; })(),
    ]);
    const meta = el("div", { class: "metaRow" }, [
      el("span", {}, [st.played + " partidas"]),
      el("span", {}, [st.wins + "G / " + st.losses + "P" + (st.ties ? " / " + st.ties + "E" : "")]),
      el("span", {}, [st.winRate + "% efectividad"]),
      el("span", {}, ["prom. " + money(st.avgBalance) + "/partida"]),
    ]);
    return el("div", { class: "leaderRow" }, [top, track, meta]);
  }

  function trendChartSvg(sortedGames, leaderboard) {
    const top = leaderboard.slice(0, 8);
    if (sortedGames.length < 2 || top.length === 0) {
      return el("div", { class: "empty" }, ["Se necesitan al menos 2 partidas guardadas para mostrar la tendencia."]);
    }
    const W = 640, H = 240, padL = 44, padR = 12, padT = 14, padB = 24;
    const n = sortedGames.length;
    const allVals = top.reduce((acc, st) => acc.concat(st.series.map((pt) => pt.cumulative)), [0]);
    const maxV = Math.max.apply(null, allVals.concat([1]));
    const minV = Math.min.apply(null, allVals.concat([0]));
    const range = maxV - minV || 1;
    const x = (i) => padL + (i / Math.max(1, n - 1)) * (W - padL - padR);
    const y = (v) => padT + (1 - (v - minV) / range) * (H - padT - padB);

    const svgNS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.style.width = "100%"; svg.style.minWidth = "480px"; svg.style.height = "auto"; svg.style.display = "block";

    function line(x1, y1, x2, y2, opts) {
      const l = document.createElementNS(svgNS, "line");
      l.setAttribute("x1", x1); l.setAttribute("y1", y1); l.setAttribute("x2", x2); l.setAttribute("y2", y2);
      l.setAttribute("stroke", (opts && opts.stroke) || "rgba(244,234,214,0.25)");
      l.setAttribute("stroke-width", (opts && opts.width) || "1");
      if (opts && opts.dash) l.setAttribute("stroke-dasharray", opts.dash);
      return l;
    }
    function text(x, y, str) {
      const t = document.createElementNS(svgNS, "text");
      t.setAttribute("x", x); t.setAttribute("y", y); t.setAttribute("text-anchor", "end");
      t.setAttribute("font-size", "9"); t.setAttribute("fill", "rgba(244,234,214,0.45)");
      t.setAttribute("font-family", "IBM Plex Mono, monospace");
      t.textContent = str;
      return t;
    }
    svg.appendChild(line(padL, y(0), W - padR, y(0), { dash: "3,3" }));
    svg.appendChild(text(padL - 6, y(0) + 3, "0"));
    svg.appendChild(text(padL - 6, y(maxV) + 3, money(maxV)));
    svg.appendChild(text(padL - 6, y(minV) + 3, money(minV)));

    top.forEach((st, idx) => {
      const color = LINE_COLORS[idx % LINE_COLORS.length];
      const pts = st.series.map((pt, i) => x(i) + "," + y(pt.cumulative)).join(" ");
      const poly = document.createElementNS(svgNS, "polyline");
      poly.setAttribute("points", pts);
      poly.setAttribute("fill", "none"); poly.setAttribute("stroke", color);
      poly.setAttribute("stroke-width", "2"); poly.setAttribute("stroke-linejoin", "round"); poly.setAttribute("stroke-linecap", "round");
      svg.appendChild(poly);
      const last = st.series[st.series.length - 1];
      if (last) {
        const c = document.createElementNS(svgNS, "circle");
        c.setAttribute("cx", x(st.series.length - 1)); c.setAttribute("cy", y(last.cumulative));
        c.setAttribute("r", "2.6"); c.setAttribute("fill", color);
        svg.appendChild(c);
      }
    });

    const wrap = el("div", { style: "overflow-x:auto" }, [svg]);
    const legend = el("div", { class: "legend" });
    top.forEach((st, idx) => {
      legend.appendChild(el("div", { class: "legendItem" }, [
        (function () { const d = el("span", { class: "dot" }); d.style.background = LINE_COLORS[idx % LINE_COLORS.length]; return d; })(),
        el("span", {}, [st.player.name]),
      ]));
    });
    wrap.appendChild(legend);
    return wrap;
  }

  function render(roster, games) {
    const main = document.getElementById("main");
    main.innerHTML = "";
    const stats = buildStats(roster, games);

    if (stats.totalGames === 0) {
      main.appendChild(el("div", { class: "panel" }, [el("div", { class: "empty" }, ["Todavía no hay partidas guardadas para mostrar estadísticas."])]));
      return;
    }

    const summary = el("div", { class: "panel" }, [el("div", { class: "sectionTitle" }, ["Resumen general"])]);
    const grid = el("div", { class: "grid2" });
    grid.appendChild(statCard("Partidas jugadas", stats.totalGames));
    grid.appendChild(statCard("Cash + virtual movido", money(stats.totalCashMoved)));
    if (stats.topWinner) grid.appendChild(statCard("Mejor balance histórico", stats.topWinner.player.name, "+" + money(stats.topWinner.totalBalance), "win"));
    if (stats.mostActive) grid.appendChild(statCard("Más partidas jugadas", stats.mostActive.player.name, stats.mostActive.played + " partidas"));
    if (stats.biggestPot) grid.appendChild(statCard("Bote más grande", money(stats.biggestPot.pot), stats.biggestPot.date));
    if (stats.topLoser && stats.topLoser.totalBalance < 0) grid.appendChild(statCard("Balance más negativo", stats.topLoser.player.name, money(stats.topLoser.totalBalance), "loss"));
    summary.appendChild(grid);
    main.appendChild(summary);

    const rankPanel = el("div", { class: "panel" }, [el("div", { class: "sectionTitle" }, ["Ranking histórico"])]);
    const maxAbs = Math.max.apply(null, stats.leaderboard.map((x) => Math.abs(x.totalBalance)).concat([1]));
    stats.leaderboard.forEach((st, i) => rankPanel.appendChild(leaderRow(st, i + 1, maxAbs)));
    main.appendChild(rankPanel);

    const trendPanel = el("div", { class: "panel" }, [el("div", { class: "sectionTitle" }, ["Tendencia (balance acumulado)"])]);
    trendPanel.appendChild(trendChartSvg(stats.sortedGames, stats.leaderboard));
    main.appendChild(trendPanel);
  }

  async function load() {
    const btn = document.getElementById("refreshBtn");
    const errBanner = document.getElementById("errBanner");
    btn.textContent = "⟳ Actualizando…";
    btn.classList.remove("err");
    errBanner.style.display = "none";
    try {
      const [roster, games] = await Promise.all([
        loadKey("poker-roster", []),
        loadKey("poker-games", []),
      ]);
      render(roster || [], games || []);
      btn.textContent = "⟳ Actualizar";
    } catch (e) {
      btn.textContent = "⟳ Error";
      btn.classList.add("err");
      errBanner.textContent = String((e && e.message) || e);
      errBanner.style.display = "block";
      console.error(e);
    }
  }

  document.getElementById("refreshBtn").addEventListener("click", load);
  load();
})();
</script>
</body>
</html>
