<script type="text/plain" id="app-source">const { useState, useEffect, useMemo, useCallback } = React;

/* ----------------------------------------------------------------------
   LECTURA DE GOOGLE SHEETS (solo lectura — el dashboard nunca escribe)
---------------------------------------------------------------------- */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwuz_uR1jZc9cUr4TIfx3HXZHqI5a6X5YaNgmLTixYkZFKR_K4q6xB86lzlJh0WmBkjpg/exec";

function sheetGet(sheetName) {
  return new Promise((resolve, reject) => {
    const cbName = "__sheetCb_" + Math.random().toString(36).slice(2);
    const iframe = document.createElement("iframe");
    iframe.style.display = "none";
    let done = false;
    const onMessage = (event) => {
      const msg = event.data;
      if (!msg || !msg.__sheetBridge || msg.callback !== cbName) return;
      if (done) return;
      done = true;
      clearTimeout(timer);
      cleanup();
      resolve(msg.data);
    };
    const cleanup = () => {
      window.removeEventListener("message", onMessage);
      if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
    };
    const timer = setTimeout(() => {
      if (done) return;
      done = true;
      cleanup();
      reject(new Error("Tiempo de espera agotado al leer " + sheetName + " de la Google Sheet."));
    }, 15000);
    window.addEventListener("message", onMessage);
    iframe.src = SCRIPT_URL + "?sheet=" + encodeURIComponent(sheetName) + "&callback=" + cbName;
    document.body.appendChild(iframe);
  });
}
async function loadRoster() {
  const rows = await sheetGet("Roster");
  return rows.slice(1).filter((r) => r[0]).map((r) => JSON.parse(r[2]));
}
async function loadGames() {
  const rows = await sheetGet("Games");
  return rows.slice(1).filter((r) => r[0]).map((r) => JSON.parse(r[2]));
}

/* ----------------------------------------------------------------------
   THEME (igual que la app principal, para que se sienta parte del mismo sitio)
---------------------------------------------------------------------- */
const FONT_IMPORT =
  "@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');";

const C = {
  felt: "#0c3527", feltDeep: "#082019", feltLine: "rgba(212,175,55,0.14)",
  card: "#f4ead6", cardDim: "#e7dabd", ink: "#241d12", inkSoft: "#5c5240",
  gold: "#d8ad3f", goldSoft: "#f0d888",
  cash: "#2fae66", cashDeep: "#1d7d49", virtual: "#8b6bf0", virtualDeep: "#6748c4",
  win: "#3fbf72", loss: "#e2634f", panel: "#123f30", panelLine: "rgba(212,175,55,0.22)",
};
const displayFont = { fontFamily: "'Bebas Neue', sans-serif", letterSpacing: "0.04em" };
const monoFont = { fontFamily: "'IBM Plex Mono', monospace" };
const bodyFont = { fontFamily: "'Inter', sans-serif" };
const money = (n) => "$" + Math.round(n || 0).toLocaleString("en-US", { maximumFractionDigits: 0 });
function round1(n) { return Math.round(n); }

function Avatar({ player, size = 30 }) {
  const av = player?.avatar;
  const base = { width: size, height: size, borderRadius: 99, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center", overflow: "hidden" };
  if (av?.type === "photo" && av.value) {
    return <img src={av.value} alt={player.name} style={{ ...base, objectFit: "cover", border: `1px solid ${C.panelLine}` }} />;
  }
  if (av?.type === "icon" && av.value) {
    return <div style={{ ...base, background: "rgba(216,173,63,0.18)", fontSize: size * 0.55 }}>{av.value}</div>;
  }
  return (
    <div style={{ ...base, background: C.gold, color: C.ink, fontWeight: 800, fontSize: size * 0.42, ...bodyFont }}>
      {(player?.name || "?").slice(0, 1).toUpperCase()}
    </div>
  );
}
function Panel({ children, style }) {
  return <div style={{ background: C.panel, border: `1px solid ${C.panelLine}`, borderRadius: 14, padding: 13, minWidth: 0, ...style }}>{children}</div>;
}
function SectionTitle({ children, right }) {
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
      <span style={{ ...displayFont, fontSize: 19, letterSpacing: "0.06em", color: C.goldSoft }}>{children}</span>
      {right}
    </div>
  );
}
function Empty({ children }) {
  return <div style={{ textAlign: "center", padding: "22px 10px", color: "rgba(244,234,214,0.45)", fontSize: 13.5 }}>{children}</div>;
}

/* ----------------------------------------------------------------------
   SETTLEMENT ENGINE (idéntico al de la app principal — necesario para
   recalcular el balance real de cada jugador en cada partida)
---------------------------------------------------------------------- */
function computeSettlement(game, roster) {
  const base = game.playerIds.map((pid) => {
    const p = roster.find((r) => r.id === pid);
    const purchases = game.purchases.filter((pu) => pu.playerId === pid);
    const cashAmount = purchases.filter((pu) => pu.type === "cash").reduce((s, pu) => s + pu.amount, 0);
    const virtualAmount = purchases.filter((pu) => pu.type === "virtual").reduce((s, pu) => s + pu.amount, 0);
    const totalBuyIn = cashAmount + virtualAmount;
    const cashOut = Number(game.finalChips[pid]) || 0;
    const balance = round1(cashOut - totalBuyIn);
    const diff = round1(cashOut - virtualAmount);
    const cashEligible = Math.max(0, diff);
    return { playerId: pid, name: p ? p.name : "?", cashAmount, virtualAmount, totalBuyIn, cashOut, balance, diff, cashEligible };
  });
  const totalCashAll = base.reduce((s, p) => s + p.cashAmount, 0);
  const rake = Math.min(game.rake || 0, totalCashAll);
  return { players: base, rake, totalCashAll };
}

/* ----------------------------------------------------------------------
   CÁLCULO DE ESTADÍSTICAS
---------------------------------------------------------------------- */
function buildStats(roster, games) {
  const sorted = [...games].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));

  const byPlayer = {};
  roster.forEach((p) => {
    byPlayer[p.id] = {
      player: p, played: 0, wins: 0, losses: 0, ties: 0,
      totalBalance: 0, totalCashIn: 0, totalVirtualIn: 0,
      best: null, worst: null, series: [],
    };
  });

  let biggestPot = null;
  sorted.forEach((g) => {
    const r = computeSettlement(g, roster);
    const pot = r.players.reduce((s, p) => s + p.totalBuyIn, 0);
    if (!biggestPot || pot > biggestPot.pot) biggestPot = { pot, date: g.date, id: g.id };
    r.players.forEach((p) => {
      const st = byPlayer[p.playerId];
      if (!st) return;
      st.played += 1;
      if (p.balance > 0) st.wins += 1;
      else if (p.balance < 0) st.losses += 1;
      else st.ties += 1;
      st.totalBalance = round1(st.totalBalance + p.balance);
      st.totalCashIn += p.cashAmount;
      st.totalVirtualIn += p.virtualAmount;
      if (!st.best || p.balance > st.best.balance) st.best = { balance: p.balance, date: g.date };
      if (!st.worst || p.balance < st.worst.balance) st.worst = { balance: p.balance, date: g.date };
      st.series.push({ date: g.date, balance: p.balance, cumulative: 0 });
    });
  });
  // acumulado por jugador, en orden cronológico
  Object.values(byPlayer).forEach((st) => {
    let acc = 0;
    st.series.forEach((pt) => { acc = round1(acc + pt.balance); pt.cumulative = acc; });
    st.winRate = st.played ? Math.round((st.wins / st.played) * 100) : 0;
    st.avgBalance = st.played ? round1(st.totalBalance / st.played) : 0;
  });

  const leaderboard = Object.values(byPlayer)
    .filter((st) => st.played > 0)
    .sort((a, b) => b.totalBalance - a.totalBalance);

  const totalGames = sorted.length;
  const totalCashMoved = sorted.reduce((s, g) => s + computeSettlement(g, roster).totalCashAll, 0);
  const topWinner = leaderboard[0] || null;
  const topLoser = leaderboard.length ? leaderboard[leaderboard.length - 1] : null;
  const mostActive = [...leaderboard].sort((a, b) => b.played - a.played)[0] || null;

  return { leaderboard, totalGames, totalCashMoved, biggestPot, topWinner, topLoser, mostActive, sortedGames: sorted };
}

/* ----------------------------------------------------------------------
   COMPONENTES VISUALES
---------------------------------------------------------------------- */
function StatCard({ label, value, sub, tone }) {
  const color = tone === "win" ? C.win : tone === "loss" ? C.loss : C.goldSoft;
  return (
    <div style={{ background: "rgba(0,0,0,0.22)", borderRadius: 10, padding: "12px 10px", minWidth: 0 }}>
      <div style={{ fontSize: 10.5, color: "rgba(244,234,214,0.5)", textTransform: "uppercase", letterSpacing: "0.04em" }}>{label}</div>
      <div style={{ ...displayFont, fontSize: 22, color, marginTop: 2, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{value}</div>
      {sub && <div style={{ fontSize: 11, color: "rgba(244,234,214,0.5)", marginTop: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{sub}</div>}
    </div>
  );
}

function LeaderRow({ st, rank, maxAbs }) {
  const win = st.totalBalance > 0;
  const flat = st.totalBalance === 0;
  const pct = maxAbs > 0 ? Math.min(100, Math.round((Math.abs(st.totalBalance) / maxAbs) * 100)) : 0;
  return (
    <div style={{ background: "rgba(0,0,0,0.18)", borderRadius: 10, padding: "10px 12px" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0 }}>
          <span style={{ ...monoFont, fontSize: 12, color: "rgba(244,234,214,0.4)", width: 18, flexShrink: 0 }}>#{rank}</span>
          <Avatar player={st.player} size={26} />
          <span style={{ color: C.card, fontWeight: 700, fontSize: 14, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{st.player.name}</span>
        </div>
        <span style={{ ...monoFont, fontWeight: 800, fontSize: 14.5, color: win ? C.win : flat ? "rgba(244,234,214,0.6)" : C.loss, flexShrink: 0 }}>
          {(st.totalBalance > 0 ? "+" : "") + money(st.totalBalance)}
        </span>
      </div>
      <div style={{ marginTop: 7, height: 6, borderRadius: 99, background: "rgba(0,0,0,0.3)", overflow: "hidden" }}>
        <div style={{ width: pct + "%", height: "100%", background: win ? C.win : flat ? "rgba(244,234,214,0.3)" : C.loss, borderRadius: 99 }} />
      </div>
      <div style={{ display: "flex", gap: 12, marginTop: 7, flexWrap: "wrap" }}>
        <span style={{ fontSize: 11, color: "rgba(244,234,214,0.55)", ...monoFont }}>{st.played} partidas</span>
        <span style={{ fontSize: 11, color: "rgba(244,234,214,0.55)", ...monoFont }}>{st.wins}G / {st.losses}P{st.ties ? ` / ${st.ties}E` : ""}</span>
        <span style={{ fontSize: 11, color: "rgba(244,234,214,0.55)", ...monoFont }}>{st.winRate}% efectividad</span>
        <span style={{ fontSize: 11, color: "rgba(244,234,214,0.55)", ...monoFont }}>prom. {money(st.avgBalance)}/partida</span>
      </div>
    </div>
  );
}

/* Gráfico de líneas SVG: balance acumulado por jugador a lo largo de las partidas */
const LINE_COLORS = ["#d8ad3f", "#3fbf72", "#8b6bf0", "#e2634f", "#4fb8e0", "#e08fc9", "#c9a24f", "#7fd9a8"];
function TrendChart({ sortedGames, leaderboard }) {
  const top = leaderboard.slice(0, 8);
  if (sortedGames.length < 2 || top.length === 0) {
    return <Empty>Se necesitan al menos 2 partidas guardadas para mostrar la tendencia.</Empty>;
  }
  const W = 640, H = 240, padL = 44, padR = 12, padT = 14, padB = 24;
  const n = sortedGames.length;
  const allVals = top.flatMap((st) => st.series.map((pt) => pt.cumulative)).concat([0]);
  const maxV = Math.max(...allVals, 1);
  const minV = Math.min(...allVals, 0);
  const range = maxV - minV || 1;
  const x = (i) => padL + (i / Math.max(1, n - 1)) * (W - padL - padR);
  const y = (v) => padT + (1 - (v - minV) / range) * (H - padT - padB);

  return (
    <div style={{ overflowX: "auto" }}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", minWidth: 480, height: "auto", display: "block" }}>
        <line x1={padL} y1={y(0)} x2={W - padR} y2={y(0)} stroke="rgba(244,234,214,0.25)" strokeWidth="1" strokeDasharray="3,3" />
        <text x={padL - 6} y={y(0) + 3} textAnchor="end" fontSize="9" fill="rgba(244,234,214,0.45)" fontFamily="IBM Plex Mono, monospace">0</text>
        <text x={padL - 6} y={y(maxV) + 3} textAnchor="end" fontSize="9" fill="rgba(244,234,214,0.45)" fontFamily="IBM Plex Mono, monospace">{money(maxV)}</text>
        <text x={padL - 6} y={y(minV) + 3} textAnchor="end" fontSize="9" fill="rgba(244,234,214,0.45)" fontFamily="IBM Plex Mono, monospace">{money(minV)}</text>
        {top.map((st, idx) => {
          const color = LINE_COLORS[idx % LINE_COLORS.length];
          const pts = st.series.map((pt, i) => `${x(i)},${y(pt.cumulative)}`).join(" ");
          const last = st.series[st.series.length - 1];
          return (
            <g key={st.player.id}>
              <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
              {last && <circle cx={x(st.series.length - 1)} cy={y(last.cumulative)} r="2.6" fill={color} />}
            </g>
          );
        })}
      </svg>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginTop: 8, justifyContent: "center" }}>
        {top.map((st, idx) => (
          <div key={st.player.id} style={{ display: "flex", alignItems: "center", gap: 5 }}>
            <span style={{ width: 9, height: 9, borderRadius: 99, background: LINE_COLORS[idx % LINE_COLORS.length], display: "inline-block" }} />
            <span style={{ fontSize: 11, color: "rgba(244,234,214,0.75)", ...bodyFont }}>{st.player.name}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ----------------------------------------------------------------------
   ROOT
---------------------------------------------------------------------- */
function Dashboard() {
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [roster, setRoster] = useState([]);
  const [games, setGames] = useState([]);
  const [refreshing, setRefreshing] = useState(false);

  const load = useCallback(async () => {
    setRefreshing(true);
    setError(null);
    try {
      const [r, g] = await Promise.all([loadRoster(), loadGames()]);
      setRoster(r); setGames(g);
    } catch (e) {
      setError(String((e && e.message) || e));
    } finally {
      setLoading(false);
      setRefreshing(false);
    }
  }, []);

  useEffect(() => { load(); }, [load]);

  const stats = useMemo(() => buildStats(roster, games), [roster, games]);

  return (
    <div style={{ minHeight: "100vh", background: `radial-gradient(ellipse at top, ${C.panel} 0%, ${C.felt} 45%, ${C.feltDeep} 100%)`, ...bodyFont }}>
      <style>{`
        ${FONT_IMPORT}
        * { box-sizing: border-box; }
        body { margin:0; }
        ::selection { background: ${C.gold}; color: ${C.ink}; }
      `}</style>
      <header style={{ borderBottom: `1px solid ${C.panelLine}`, background: "rgba(0,0,0,0.15)", position: "sticky", top: 0, zIndex: 20, backdropFilter: "blur(6px)" }}>
        <div style={{ maxWidth: 720, margin: "0 auto", padding: "14px 10px" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
            <div style={{ display: "flex", alignItems: "baseline", gap: 8, minWidth: 0 }}>
              <span style={{ ...displayFont, fontSize: 26, color: C.gold, lineHeight: 1 }}>BARILOCHE</span>
              <span style={{ ...bodyFont, fontSize: 10.5, color: "rgba(240,216,136,0.55)", letterSpacing: "0.12em", textTransform: "uppercase" }}>estadísticas</span>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 6, flexShrink: 0 }}>
              <a
                href="./index.html"
                title="Volver a la app"
                style={{
                  display: "flex", alignItems: "center", gap: 5, textDecoration: "none",
                  background: "rgba(244,234,214,0.08)", border: `1px solid ${C.panelLine}`,
                  borderRadius: 8, padding: "6px 9px", color: "rgba(244,234,214,0.75)",
                  fontSize: 11, ...bodyFont, fontWeight: 600,
                }}
              >
                ← App
              </a>
              <button
                onClick={load} disabled={refreshing}
                style={{
                  display: "flex", alignItems: "center", gap: 5, flexShrink: 0,
                  background: error ? "rgba(200,80,70,0.18)" : "rgba(244,234,214,0.08)",
                  border: `1px solid ${error ? "rgba(200,80,70,0.4)" : C.panelLine}`,
                  borderRadius: 8, padding: "6px 9px", cursor: refreshing ? "default" : "pointer",
                  color: error ? "#e6a79c" : "rgba(244,234,214,0.75)", fontSize: 11, ...bodyFont, fontWeight: 600,
                }}
              >
                <span style={{ display: "inline-block", fontSize: 13, lineHeight: 1, transform: refreshing ? "rotate(180deg)" : "none", transition: "transform 0.3s" }}>⟳</span>
                {refreshing ? "Actualizando…" : error ? "Error" : "Actualizar"}
              </button>
            </div>
          </div>
          {error && <div style={{ fontSize: 10, color: "rgba(230,167,156,0.9)", marginTop: 4 }}>{error}</div>}
        </div>
      </header>

      <main style={{ maxWidth: 720, margin: "0 auto", padding: "14px 10px 60px", display: "grid", gap: 16 }}>
        {loading ? (
          <div style={{ textAlign: "center", padding: "60px 10px", color: C.goldSoft, ...displayFont, fontSize: 22 }}>Cargando estadísticas…</div>
        ) : stats.totalGames === 0 ? (
          <Panel><Empty>Todavía no hay partidas guardadas para mostrar estadísticas.</Empty></Panel>
        ) : (
          <>
            <Panel>
              <SectionTitle>Resumen general</SectionTitle>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(2,1fr)", gap: 8 }}>
                <StatCard label="Partidas jugadas" value={stats.totalGames} />
                <StatCard label="Cash + virtual movido" value={money(stats.totalCashMoved)} />
                {stats.topWinner && <StatCard label="Mejor balance histórico" value={stats.topWinner.player.name} sub={"+" + money(stats.topWinner.totalBalance)} tone="win" />}
                {stats.mostActive && <StatCard label="Más partidas jugadas" value={stats.mostActive.player.name} sub={stats.mostActive.played + " partidas"} />}
                {stats.biggestPot && <StatCard label="Bote más grande" value={money(stats.biggestPot.pot)} sub={stats.biggestPot.date} />}
                {stats.topLoser && stats.topLoser.totalBalance < 0 && <StatCard label="Balance más negativo" value={stats.topLoser.player.name} sub={money(stats.topLoser.totalBalance)} tone="loss" />}
              </div>
            </Panel>

            <Panel>
              <SectionTitle>Ranking histórico</SectionTitle>
              <div style={{ display: "grid", gap: 8 }}>
                {stats.leaderboard.map((st, i) => (
                  <LeaderRow key={st.player.id} st={st} rank={i + 1} maxAbs={Math.max(...stats.leaderboard.map((x) => Math.abs(x.totalBalance)), 1)} />
                ))}
              </div>
            </Panel>

            <Panel>
              <SectionTitle>Tendencia (balance acumulado)</SectionTitle>
              <TrendChart sortedGames={stats.sortedGames} leaderboard={stats.leaderboard} />
            </Panel>
          </>
        )}
      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Dashboard />);
</script>

<script>
(function () {
  function showError(err) {
    var el = document.getElementById("boot-error");
    el.style.display = "block";
    el.textContent = "Error al iniciar el dashboard:\n\n" + (err && err.stack ? err.stack : err);
    console.error(err);
  }
  try {
    var missing = [];
    if (typeof React === "undefined") missing.push("React (react.production.min.js)");
    if (typeof ReactDOM === "undefined") missing.push("ReactDOM (react-dom.production.min.js)");
    if (typeof Babel === "undefined") missing.push("Babel (babel.min.js)");
    if (missing.length) {
      throw new Error(
        "No se pudieron cargar estos scripts desde internet:\n- " + missing.join("\n- ") +
        "\n\nRevisa tu conexión, o si un bloqueador de anuncios/DNS está bloqueando cdn.jsdelivr.net, y recarga la página."
      );
    }
    var src = document.getElementById("app-source").textContent;
    var out = Babel.transform(src, { presets: ["react"] }).code;
    (0, eval)(out);
  } catch (err) {
    showError(err);
  }
})();
</script>
</body>
