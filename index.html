          );
        })}
      </div>
      <div style={{ fontSize: 11.5, color: "rgba(244,234,214,0.45)", marginTop: 8 }}>
        Este cargo de cena es independiente del conteo de lotes y no afecta el balance de la partida.
      </div>
    </div>
  );
}

/* ----- Finalize: enter chips returned per player ----- */
function FinalizeGame({ game, roster, onBack, onConfirm }) {
  const players = game.playerIds.map((id) => roster.find((r) => r.id === id)).filter(Boolean);
  const [values, setValues] = useState(() =>
    Object.fromEntries(players.map((p) => [p.id, game.finalChips && game.finalChips[p.id] !== undefined ? String(game.finalChips[p.id]) : ""]))
  );

  const buyIns = useMemo(() => {
    const map = {};
    players.forEach((p) => {
      const entries = game.purchases.filter((pu) => pu.playerId === p.id);
      const cash = entries.filter((e) => e.type === "cash").reduce((s, e) => s + e.amount, 0);
      const virtual = entries.filter((e) => e.type === "virtual").reduce((s, e) => s + e.amount, 0);
      map[p.id] = { cash, virtual, total: cash + virtual };
    });
    return map;
  }, [players, game.purchases]);

  const totalCash = useMemo(() => Object.values(buyIns).reduce((s, b) => s + b.cash, 0), [buyIns]);
  const totalVirtual = useMemo(() => Object.values(buyIns).reduce((s, b) => s + b.virtual, 0), [buyIns]);
  const rake = Number(game.rake) || 0;
  const targetTotal = totalCash + totalVirtual;
  // Lo máximo que puede sumar lo entregado por los jugadores: el total buy-in
  // menos el rake, que ya no vuelve a la mesa.
  const maxAllowed = round1(targetTotal - rake);

  const playersSum = players.reduce((s, p) => s + (Number(values[p.id]) || 0), 0);
  const enteredCount = players.filter((p) => values[p.id] !== "").length;
  const diff = round1(playersSum - maxAllowed);
  const overAllocated = playersSum > maxAllowed + 0.005;

  const ready = players.every((p) => values[p.id] === "" || !isNaN(Number(values[p.id]))) && !overAllocated;

  return (
    <div style={{ display: "grid", gap: 16 }}>
      <Panel>
        <SectionTitle icon={Trophy}>Entrega de fichas</SectionTitle>
        <div style={{ color: "rgba(244,234,214,0.6)", fontSize: 12.5, marginBottom: 10 }}>
          Cada jugador entrega el valor en dinero de las fichas que tiene en su poder al cierre (monto libre). El rake ya se descuenta del total a repartir.
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 6, marginBottom: 14 }}>
          <ScoreBox label="Cash" value={money(totalCash)} tone="cash" />
          <ScoreBox label="Virtual" value={money(totalVirtual)} tone="virtual" />
          <ScoreBox label="Máx. a repartir" value={money(maxAllowed)} />
          <div style={{
            background: "rgba(0,0,0,0.22)", borderRadius: 9, padding: "7px 4px", textAlign: "center", minWidth: 0,
            border: `1px solid ${enteredCount === 0 ? C.panelLine : overAllocated ? C.loss : diff === 0 ? C.win : C.panelLine}`,
          }}>
            <div style={{ fontSize: 9.5, color: "rgba(244,234,214,0.5)", textTransform: "uppercase", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>Ingresado</div>
            <div style={{ ...monoFont, fontWeight: 700, fontSize: 13, color: enteredCount === 0 ? C.goldSoft : overAllocated ? C.loss : diff === 0 ? C.win : C.card, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
              {money(playersSum)}
            </div>
            <div style={{ fontSize: 9, ...monoFont, color: "rgba(244,234,214,0.45)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
              {enteredCount === 0 ? "—" : diff === 0 ? "cuadra ✓" : money(diff)}
            </div>
          </div>
        </div>
        <div style={{ display: "grid", gap: 8 }}>
          <div style={{ background: "rgba(216,173,63,0.1)", border: `1px dashed ${C.panelLine}`, borderRadius: 9, padding: "9px 10px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <div style={{ width: 26, height: 26, borderRadius: 99, background: "rgba(216,173,63,0.22)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                <Flame size={13} color={C.gold} />
              </div>
              <span style={{ color: C.goldSoft, fontWeight: 700, fontSize: 13.5 }}>Rake (casa)</span>
              <span style={{ ...monoFont, fontSize: 10.5, color: "rgba(244,234,214,0.4)" }}>ya descontado del máximo a repartir</span>
            </div>
            <span style={{ ...monoFont, fontSize: 13.5, color: C.goldSoft, fontWeight: 700 }}>{money(rake)}</span>
          </div>
          {players.map((p) => {
            const bi = buyIns[p.id];
            return (
              <div key={p.id} style={{ background: "rgba(0,0,0,0.18)", borderRadius: 9, padding: "9px 10px" }}>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0 }}>
                    <Avatar player={p} size={26} />
                    <span style={{ color: C.card, fontWeight: 600, fontSize: 13.5, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.name}</span>
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 5, flexShrink: 0 }}>
                    <span style={{ color: "rgba(244,234,214,0.5)", fontSize: 13 }}>$</span>
                    <input type="number" min="0" style={{ ...inputStyle, width: 88, padding: "9px 6px", textAlign: "right" }} placeholder="0"
                      value={values[p.id]} onChange={(e) => setValues((c) => ({ ...c, [p.id]: e.target.value }))} />
                  </div>
                </div>
                <div style={{ display: "flex", gap: 6, marginTop: 7, marginLeft: 34, flexWrap: "wrap" }}>
                  <Badge tone="cash">Cash {money(bi.cash)}</Badge>
                  <Badge tone="virtual">Virtual {money(bi.virtual)}</Badge>
                  <span style={{ ...monoFont, fontSize: 11, color: "rgba(244,234,214,0.5)", alignSelf: "center" }}>
                    Total buy-in {money(bi.total)}
                  </span>
                </div>
              </div>
            );
          })}
        </div>
        {overAllocated && (
          <div style={{ display: "flex", gap: 7, alignItems: "flex-start", marginTop: 12, background: "rgba(226,99,79,0.16)", border: `1px solid ${C.loss}`, borderRadius: 8, padding: "8px 10px" }}>
            <AlertCircle size={15} color={C.loss} style={{ flexShrink: 0, marginTop: 1 }} />
            <div style={{ fontSize: 12, color: "rgba(244,234,214,0.9)" }}>
              Te pasaste por <strong>{money(diff)}</strong>. Lo entregado no puede superar el máximo a repartir ({money(maxAllowed)} = Cash {money(totalCash)} − Rake {money(rake)} + Virtual {money(totalVirtual)}). Ajusta los montos para continuar.
            </div>
          </div>
        )}
        {!overAllocated && ready && diff !== 0 && enteredCount > 0 && (
          <div style={{ display: "flex", gap: 7, alignItems: "flex-start", marginTop: 12, background: "rgba(216,173,63,0.1)", border: `1px solid ${C.panelLine}`, borderRadius: 8, padding: "8px 10px" }}>
            <AlertCircle size={15} color={C.goldSoft} style={{ flexShrink: 0, marginTop: 1 }} />
            <div style={{ fontSize: 12, color: "rgba(244,234,214,0.85)" }}>
              Falta por repartir {money(-diff)} respecto al máximo ({money(maxAllowed)}). Puedes continuar, pero revisa el conteo.
            </div>
          </div>
        )}
      </Panel>
      <div style={{ display: "flex", gap: 10 }}>
        <GhostBtn onClick={onBack}>Volver</GhostBtn>
        <PrimaryBtn
          disabled={!ready}
          onClick={() => onConfirm(Object.fromEntries(players.map((p) => [p.id, Number(values[p.id]) || 0])))}
          icon={Trophy} style={{ flex: 1, padding: "12px 16px" }}
        >
          Calcular resultados
        </PrimaryBtn>
      </div>
    </div>
  );
}

/* ----- Finalized game: results table + transfers + save/close ----- */
function ResultRow({ label, value, tone, strong }) {
  const color = tone === "cash" ? C.cash : tone === "virtual" ? C.virtual : tone === "win" ? C.win : tone === "loss" ? C.loss : "rgba(244,234,214,0.85)";
  return (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 0", borderBottom: `1px solid rgba(255,255,255,0.06)` }}>
      <span style={{ fontSize: 12.5, color: "rgba(244,234,214,0.55)" }}>{label}</span>
      <span style={{ ...monoFont, fontSize: 14, fontWeight: strong ? 800 : 600, color }}>{value}</span>
    </div>
  );
}
function PlayerResultCard({ p, player }) {
  const win = p.balance > 0;
  const flat = p.balance === 0;
  return (
    <div style={{ background: "rgba(0,0,0,0.2)", border: `1px solid ${win ? "rgba(63,191,114,0.35)" : flat ? C.panelLine : "rgba(226,99,79,0.35)"}`, borderRadius: 12, padding: "12px 14px" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
          {player ? <Avatar player={player} size={30} /> : null}
          <span style={{ ...displayFont, fontSize: 19, color: C.card, letterSpacing: "0.03em" }}>{p.name}</span>
        </div>
        <span style={{
          ...monoFont, fontWeight: 800, fontSize: 20,
          color: win ? C.win : flat ? "rgba(244,234,214,0.6)" : C.loss,
        }}>
          {money(p.balance)}
        </span>
      </div>
      <ResultRow label="Buy-in cash" value={money(p.cashAmount)} tone="cash" />
      <ResultRow label="Buy-in virtual" value={money(p.virtualAmount)} tone="virtual" />
      <ResultRow label="Total buy-in" value={money(p.totalBuyIn)} />
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", margin: "8px 0", padding: "7px 10px", background: "rgba(216,173,63,0.12)", border: `1px solid ${C.panelLine}`, borderRadius: 8 }}>
        <span style={{ fontSize: 12.5, color: "rgba(244,234,214,0.65)" }}>Cash out (fichas)</span>
        <span style={{ ...monoFont, fontSize: 14, fontWeight: 800, color: C.goldSoft }}>{money(p.cashOut)}</span>
      </div>
      <div style={{ marginTop: 6, borderTop: `1px solid ${C.panelLine}`, paddingTop: 6, display: "grid", gap: 4 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "5px 8px", borderRadius: 7, background: p.pagoCash > 0 ? "rgba(47,174,102,0.14)" : "rgba(255,255,255,0.03)" }}>
          <span style={{ fontSize: 13, fontWeight: 700, color: p.pagoCash > 0 ? C.cash : "rgba(244,234,214,0.55)" }}>{p.pagoCashLabel}</span>
          <span style={{ ...monoFont, fontSize: 14.5, fontWeight: 800, color: p.pagoCash > 0 ? C.cash : "rgba(244,234,214,0.55)" }}>{money(p.pagoCash)}</span>
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "5px 8px", borderRadius: 7, background: p.pagoTransfer > 0 ? "rgba(63,191,114,0.14)" : p.pagoTransfer < 0 ? "rgba(226,99,79,0.14)" : "rgba(255,255,255,0.03)" }}>
          <span style={{ fontSize: 13, fontWeight: 700, color: p.pagoTransfer > 0 ? C.win : p.pagoTransfer < 0 ? C.loss : "rgba(244,234,214,0.55)" }}>{p.pagoTransferLabel}</span>
          <span style={{ ...monoFont, fontSize: 14.5, fontWeight: 800, color: p.pagoTransfer > 0 ? C.win : p.pagoTransfer < 0 ? C.loss : "rgba(244,234,214,0.55)" }}>{money(p.pagoTransfer)}</span>
        </div>
      </div>
    </div>
  );
}
function FinalizedGame({ game, roster, onClose, onEdit }) {
  const r = useMemo(() => computeSettlement(game, roster), [game, roster]);
  const players = game.playerIds.map((id) => roster.find((p) => p.id === id)).filter(Boolean);
  const numPlayers = players.length || 1;
  const d = game.dinner;

  const sortedByBalance = r.players.slice().sort((a, b) => b.balance - a.balance);
  const champion = sortedByBalance[0];
  const championPlayer = champion ? players.find((pl) => pl.id === champion.playerId) : null;

  return (
    <div style={{ display: "grid", gap: 16 }}>
      <Panel>
        <SectionTitle icon={Trophy}>Resultados de la partida</SectionTitle>
        <div style={{ ...monoFont, fontSize: 13, color: "rgba(244,234,214,0.6)", marginBottom: 10 }}>{game.date}</div>
        {champion && (
          <div style={{
            display: "flex", alignItems: "center", gap: 12, background: "rgba(216,173,63,0.14)",
            border: `1px solid ${C.gold}`, borderRadius: 12, padding: "14px 16px", marginBottom: 14,
          }}>
            <span style={{ fontSize: 36, lineHeight: 1, flexShrink: 0 }}>🏆</span>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontSize: 11, color: "rgba(244,234,214,0.55)", textTransform: "uppercase", letterSpacing: "0.06em" }}>Campeón de la partida</div>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 2 }}>
                <Avatar player={championPlayer} size={30} />
                <span style={{ ...displayFont, fontSize: 26, color: C.goldSoft, lineHeight: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                  {champion.name}
                </span>
                <span style={{ ...monoFont, fontSize: 15, fontWeight: 800, color: C.win, flexShrink: 0 }}>
                  +{money(champion.balance)}
                </span>
              </div>
            </div>
          </div>
        )}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 8, marginBottom: 14 }}>
          <ScoreBox label="Rake" value={money(r.rake)} />
          <ScoreBox label="Total buy-in cash" value={money(r.cashPool)} tone="cash" />
          <ScoreBox label="Total buy-in virtual" value={money(r.players.reduce((s, p) => s + p.virtualAmount, 0))} tone="virtual" />
        </div>

        <div style={{ display: "grid", gap: 10 }}>
          {sortedByBalance.map((p) => (
            <PlayerResultCard key={p.playerId} p={p} player={players.find((pl) => pl.id === p.playerId)} />
          ))}
        </div>
      </Panel>

      <Panel>
        <SectionTitle icon={Banknote}>Reparto de efectivo</SectionTitle>
        <div style={{ display: "grid", gap: 8 }}>
          {r.cashDistribution.map((c) => (
            <div key={c.playerId} style={{ display: "flex", justifyContent: "space-between", background: "rgba(0,0,0,0.18)", borderRadius: 8, padding: "8px 10px" }}>
              <span style={{ color: C.card, fontSize: 13.5, fontWeight: 600 }}>{c.name}</span>
              <span style={{ ...monoFont, fontSize: 13.5, fontWeight: 700, color: C.cash }}>{money(c.amount)}</span>
            </div>
          ))}
          {r.cashDistribution.length === 0 && <Empty>No hay efectivo para repartir.</Empty>}
        </div>
        <div style={{
          display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 10,
          padding: "8px 10px", borderRadius: 8,
          background: r.cashDistributed === r.cashPool ? "rgba(63,191,114,0.12)" : "rgba(226,99,79,0.12)",
          border: `1px solid ${r.cashDistributed === r.cashPool ? C.win : C.loss}`,
        }}>
          <span style={{ fontSize: 12, color: "rgba(244,234,214,0.7)" }}>Repartido {money(r.cashDistributed)} de {money(r.cashPool)}</span>
          <span style={{ ...monoFont, fontWeight: 700, fontSize: 12.5, color: r.cashDistributed === r.cashPool ? C.win : C.loss }}>
            {r.cashDistributed === r.cashPool ? "cuadra ✓" : money(r.cashPool - r.cashDistributed) + " sin repartir"}
          </span>
        </div>
      </Panel>

      <Panel>
        <SectionTitle icon={ArrowRightLeft}>Transferencias sugeridas</SectionTitle>
        <div style={{ display: "grid", gap: 8 }}>
          {r.transfers.length === 0 && <Empty>No se requieren transferencias.</Empty>}
          {r.transfers.map((t, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, background: "rgba(0,0,0,0.18)", borderRadius: 8, padding: "9px 12px" }}>
              <span style={{ color: C.card, fontWeight: 700, fontSize: 13.5 }}>{t.from}</span>
              <ArrowRightLeft size={13} color={C.gold} />
              <span style={{ color: C.card, fontWeight: 700, fontSize: 13.5 }}>{t.to}</span>
              <span style={{ marginLeft: "auto", ...monoFont, color: C.gold, fontWeight: 700 }}>{money(t.amount)}</span>
            </div>
          ))}
        </div>
      </Panel>

      <Panel>
        <SectionTitle icon={UtensilsCrossed}>Cargo de cena (no afecta el balance de lotes)</SectionTitle>
        <div style={{ display: "grid", gap: 6 }}>
          {players.map((p) => {
            const alcohol = !!d.alcohol[p.id];
            const charge = d.total / numPlayers + d.waiter + (alcohol ? d.alcoholFee : 0);
            const paid = !!d.paid?.[p.id];
            const method = d.paymentMethod?.[p.id] || "fichas";
            const methodLabel = method === "cash" ? "Cash" : method === "mixto" ? "Combinado" : "Fichas";
            return (
              <div key={p.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: "rgba(0,0,0,0.16)", borderRadius: 8, padding: "7px 10px" }}>
                <span style={{ fontSize: 13, color: C.card, display: "flex", alignItems: "center", gap: 6 }}>
                  {p.name} {alcohol && <Wine size={12} color={C.virtual} />}
                </span>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ ...monoFont, fontSize: 11, color: "rgba(244,234,214,0.5)" }}>{methodLabel}</span>
                  <span style={{ ...monoFont, fontSize: 13, color: "rgba(244,234,214,0.8)" }}>{money(charge)}</span>
                  <span style={{ fontSize: 10.5, fontWeight: 700, color: paid ? C.win : C.loss, ...monoFont }}>{paid ? "PAGADO" : "PENDIENTE"}</span>
                </div>
              </div>
            );
          })}
        </div>
      </Panel>

      <div style={{ display: "flex", gap: 10 }}>
        <GhostBtn onClick={onEdit} icon={Pencil}>Regresar y editar cash out</GhostBtn>
        <PrimaryBtn onClick={onClose} icon={Save} style={{ flex: 1, padding: "13px 18px", fontSize: 15 }}>
          Guardar y cerrar partida
        </PrimaryBtn>
      </div>
    </div>
  );
}
function Th({ children, align }) {
  return <th style={{ textAlign: align || "right", padding: "0 8px 8px", whiteSpace: "nowrap" }}>{children}</th>;
}
function Td({ children, align, bold, tone, signed, value, strong }) {
  let color = "rgba(244,234,214,0.85)";
  if (tone === "cash") color = C.cash;
  if (tone === "virtual") color = C.virtual;
  if (signed && typeof value === "number") color = value > 0 ? C.win : value < 0 ? C.loss : color;
  return (
    <td style={{ textAlign: align || "right", padding: "8px", ...monoFont, fontSize: 13, color, fontWeight: bold || strong ? 700 : 500, whiteSpace: "nowrap" }}>
      {children}
    </td>
  );
}

/* ----------------------------------------------------------------------
   HISTORY TAB
---------------------------------------------------------------------- */
function HistoryTab({ games, setGames, roster }) {
  const [openId, setOpenId] = useState(null);
  const [confirmId, setConfirmId] = useState(null);
  const sorted = [...games].sort((a, b) => (a.date < b.date ? 1 : -1));

  const deleteGame = (id) => {
    setGames((gs) => gs.filter((g) => g.id !== id));
    setConfirmId(null);
    if (openId === id) setOpenId(null);
  };

  if (sorted.length === 0) {
    return <Panel><Empty>Aún no hay partidas guardadas.</Empty></Panel>;
  }

  return (
    <div style={{ display: "grid", gap: 12 }}>
      {sorted.map((g) => {
        const open = openId === g.id;
        const confirming = confirmId === g.id;
        const results = computeSettlement(g, roster);
        const winner = results.players.slice().sort((a, b) => b.balance - a.balance)[0];
        return (
          <Panel key={g.id}>
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <button onClick={() => setOpenId(open ? null : g.id)} style={{ flex: 1, minWidth: 0, background: "transparent", border: "none", cursor: "pointer", padding: 0 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 6 }}>
                  <div style={{ textAlign: "left", minWidth: 0 }}>
                    <div style={{ ...displayFont, fontSize: 18, color: C.goldSoft }}>{g.date}</div>
                    {winner && (
                      <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 3 }}>
                        <span style={{ fontSize: 18, lineHeight: 1, flexShrink: 0 }}>🏆</span>
                        <span style={{ ...displayFont, fontSize: 17, color: C.gold, lineHeight: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                          {winner.name}
                        </span>
                        <span style={{ ...monoFont, fontSize: 11.5, fontWeight: 700, color: C.win, flexShrink: 0 }}>+{money(winner.balance)}</span>
                      </div>
                    )}
                    <div style={{ fontSize: 11, color: "rgba(244,234,214,0.45)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", marginTop: 3 }}>
                      {g.playerIds.length} jugadores · lote {money(g.loteValue)} · rake {money(g.rake)}
                    </div>
                  </div>
                  {open ? <ChevronUp size={16} color={C.goldSoft} style={{ flexShrink: 0 }} /> : <ChevronDown size={16} color={C.goldSoft} style={{ flexShrink: 0 }} />}
                </div>
              </button>
              <button
                onClick={() => setConfirmId(g.id)}
                title="Eliminar esta partida"
                style={{ flexShrink: 0, background: "transparent", border: "none", cursor: "pointer", padding: 6, color: "rgba(226,99,79,0.7)" }}
              >
                <Trash2 size={16} />
              </button>
            </div>
            {confirming && (
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 10, background: "rgba(226,99,79,0.12)", border: `1px solid ${C.loss}`, borderRadius: 8, padding: "8px 10px" }}>
                <span style={{ fontSize: 12, color: "rgba(244,234,214,0.9)", flex: 1 }}>¿Eliminar esta partida? No se puede deshacer.</span>
                <button onClick={() => setConfirmId(null)} style={{ background: "transparent", border: `1px solid ${C.panelLine}`, borderRadius: 6, padding: "5px 9px", color: "rgba(244,234,214,0.75)", fontSize: 11.5, cursor: "pointer", ...bodyFont }}>Cancelar</button>
                <button onClick={() => deleteGame(g.id)} style={{ background: C.loss, border: "none", borderRadius: 6, padding: "5px 9px", color: "#2a1512", fontSize: 11.5, fontWeight: 700, cursor: "pointer", ...bodyFont }}>Eliminar</button>
              </div>
            )}
            {open && (
              <div style={{ display: "grid", gap: 8, marginTop: 12 }}>
                {results.players.slice().sort((a, b) => b.balance - a.balance).map((p) => (
                  <PlayerResultCard key={p.playerId} p={p} player={roster.find((pl) => pl.id === p.playerId)} />
                ))}
              </div>
            )}
          </Panel>
        );
      })}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<PokerLedger />);
</script>

<script>
(function () {
  function showError(err) {
    var el = document.getElementById("boot-error");
    el.style.display = "block";
    el.textContent = "Error al iniciar la app:\n\n" + (err && err.stack ? err.stack : err);
    console.error(err);
  }
  try {
    var missing = [];
    if (typeof React === "undefined") missing.push("React (react.production.min.js)");
    if (typeof ReactDOM === "undefined") missing.push("ReactDOM (react-dom.production.min.js)");
    if (typeof Babel === "undefined") missing.push("Babel (babel.min.js)");
    if (missing.length) {
      throw new Error(
        "No se pudieron cargar estos scripts desde internet:\n- " + missing.join("\n- ") +
        "\n\nRevisa tu conexión, o si un bloqueador de anuncios/DNS está bloqueando cdn.jsdelivr.net, y recarga la página."
      );
    }
    var src = document.getElementById("app-source").textContent;
    var out = Babel.transform(src, { presets: ["react"] }).code;
    (0, eval)(out);
  } catch (err) {
    showError(err);
  }
})();
