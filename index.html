/* ----------------------------------------------------------------------
   LECTURA/ESCRITURA EN GOOGLE SHEETS (vía Google Apps Script Web App)
   No requiere login: el script corre con los permisos de quien lo
   desplegó, y queda expuesto como una URL pública de solo tu grupo.
---------------------------------------------------------------------- */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwuz_uR1jZc9cUr4TIfx3HXZHqI5a6X5YaNgmLTixYkZFKR_K4q6xB86lzlJh0WmBkjpg/exec";

// Nota: la lectura usa un <iframe> oculto + postMessage (no fetch() ni <script src>)
// porque Google Apps Script a veces no manda encabezados CORS correctos (fetch falla
// con "Failed to fetch") y el truco JSONP clásico lo bloquea el "ORB" (Opaque
// Response Blocking) de Chrome. El iframe carga la respuesta como una navegación
// completa — igual que abrir la URL directo en una pestaña, que siempre funcionó —
// y no como un recurso incrustado, así que ninguna de esas dos protecciones aplica.
function sheetGet(sheetName) {
  return new Promise((resolve, reject) => {
    const cbName = "__sheetCb_" + Math.random().toString(36).slice(2);
    const iframe = document.createElement("iframe");
    iframe.style.display = "none";
    let done = false;
    const onMessage = (event) => {
      const msg = event.data;
      if (!msg || !msg.__sheetBridge || msg.callback !== cbName) return;
      if (done) return;
      done = true;
      clearTimeout(timer);
      cleanup();
      resolve(msg.data);
    };
    const cleanup = () => {
      window.removeEventListener("message", onMessage);
      if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
    };
    const timer = setTimeout(() => {
      if (done) return;
      done = true;
      cleanup();
      reject(new Error("Tiempo de espera agotado al leer " + sheetName + " de la Google Sheet."));
    }, 15000);
    window.addEventListener("message", onMessage);
    iframe.src = SCRIPT_URL + "?sheet=" + encodeURIComponent(sheetName) + "&callback=" + cbName;
    document.body.appendChild(iframe);
  });
}
async function sheetSet(sheetName, values2D) {
  // Escritura en modo "no-cors": no podemos leer la respuesta (queda opaca),
  // pero por la misma razón no se bloquea por falta de encabezados CORS —
  // si la solicitud llega a salir por la red, Apps Script la procesa igual.
  try {
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // evita el preflight CORS
      body: JSON.stringify({ sheet: sheetName, values: values2D }),
    });
    return { ok: true };
  } catch (e) {
    throw new Error(
      "No se pudo conectar con la Google Sheet para guardar " + sheetName + ". Revisa tu conexión a internet. (" + e.message + ")"
    );
  }
}

/* -------- API de alto nivel usada por la app --------
   Importante: estas funciones de lectura ahora PROPAGAN el error en vez de
   devolver una lista vacía cuando falla la conexión. Antes, un fallo de red
   (típico justo al refrescar la página en celular) se disfrazaba de "no hay
   datos", y como el guardado automático dispara apenas termina de cargar,
   esa vacuidad se terminaba guardando de vuelta en la hoja real — borrando
   los datos de verdad. Ahora el fallo se nota, y quien llama decide qué
   hacer (normalmente: no guardar nada hasta lograr una lectura exitosa). */
async function loadRoster() {
  const rows = await sheetGet("Roster");
  return rows.slice(1).filter((r) => r[0]).map((r) => JSON.parse(r[2]));
}
async function saveRoster(list) {
  // Antes de guardar, se trae el roster remoto y se combina con el local (nunca se
  // borra a alguien que no está en la lista local): si otro celular agregó un
  // jugador que todavía no llegó a este dispositivo, esa fusión evita perderlo por
  // una escritura que sobreescribe toda la hoja. Para IDs que existen en ambos
  // lados, gana la versión local (es la que el usuario acaba de editar/dar de baja).
  let merged = list;
  try {
    const remote = await loadRoster();
    const byId = {};
    remote.forEach((p) => { byId[p.id] = p; });
    list.forEach((p) => { byId[p.id] = p; });
    merged = Object.values(byId);
  } catch (e) {
    console.warn("saveRoster: no se pudo leer el roster remoto antes de guardar; se guarda solo con los datos locales", e);
  }
  const rows = [["ID", "Nombre", "Data"]].concat(merged.map((p) => [p.id, p.name, JSON.stringify(p)]));
  await sheetSet("Roster", rows);
}
async function loadGames() {
  const rows = await sheetGet("Games");
  return rows.slice(1).filter((r) => r[0]).map((r) => JSON.parse(r[2]));
}
async function saveGames(list) {
  const rows = [["ID", "Fecha", "Data"]].concat(list.map((g) => [g.id, g.date, JSON.stringify(g)]));
  await sheetSet("Games", rows);
}
async function loadActiveGame() {
  const rows = await sheetGet("ActiveGame");
  const val = rows[1] && rows[1][0] ? rows[1][0] : "";
  return val ? JSON.parse(val) : null;
}
async function saveActiveGame(game) {
  await sheetSet("ActiveGame", [["Data"], [game ? JSON.stringify(game) : ""]]);
}

/* Break an amount (assumed multiple of 100) into bills of 500/200/100 */
function billsFor(amount) {
  let a = Math.max(0, Math.round(amount / 100) * 100);
  const b500 = Math.floor(a / 500); a -= b500 * 500;
  const b200 = Math.floor(a / 200); a -= b200 * 200;
  const b100 = Math.round(a / 100);
  return { 500: b500, 200: b200, 100: b100 };
}
function billsLabel(bd) {
  const parts = [];
  if (bd[500]) parts.push(`${bd[500]}×$500`);
  if (bd[200]) parts.push(`${bd[200]}×$200`);
  if (bd[100]) parts.push(`${bd[100]}×$100`);
  return parts.length ? parts.join(" + ") : "—";
}

/* ----------------------------------------------------------------------
   SETTLEMENT ENGINE
---------------------------------------------------------------------- */
function computeSettlement(game, roster) {
  const base = game.playerIds.map((pid) => {
    const p = roster.find((r) => r.id === pid);
    const purchases = game.purchases.filter((pu) => pu.playerId === pid);
    const cashAmount = purchases.filter((pu) => pu.type === "cash").reduce((s, pu) => s + pu.amount, 0);
    const virtualAmount = purchases.filter((pu) => pu.type === "virtual").reduce((s, pu) => s + pu.amount, 0);
    const totalBuyIn = cashAmount + virtualAmount;
    const cashOut = Number(game.finalChips[pid]) || 0; // lo reportado en fichas
    const balance = round1(cashOut - totalBuyIn);

    // El cash out primero salda el buy-in virtual (una deuda sin respaldo físico).
    // Lo que sobra queda "elegible" para cobrarse en efectivo real de la mesa. Si el
    // cash out ni siquiera alcanza a saldar el virtual, no queda nada elegible: se
    // debe ese faltante completo por transferencia.
    const diff = round1(cashOut - virtualAmount);
    const cashEligible = Math.max(0, diff);
    return { playerId: pid, name: p ? p.name : "?", cashAmount, virtualAmount, totalBuyIn, cashOut, balance, diff, cashEligible };
  });

  const totalCashAll = base.reduce((s, p) => s + p.cashAmount, 0);
  const rake = Math.min(game.rake || 0, totalCashAll);
  const cashPool = Math.max(0, round1(totalCashAll - rake));

  // REPARTO DE EFECTIVO: se reparte el efectivo real de la mesa (Total buy-in cash -
  // Rake) entre quienes tienen saldo elegible para cobrar en efectivo, de mayor a
  // menor, hasta agotarlo — sin taparlo con lo que cada quien puso individualmente,
  // porque el efectivo de la mesa es un solo fondo común. Lo que un jugador no
  // alcanza a cobrar en efectivo (porque ya se agotó) se liquida por transferencia.
  const orderedByEligible = base.filter((p) => p.cashEligible > 0).sort((a, b) => b.cashEligible - a.cashEligible);
  let remainingPool = cashPool;
  const cashDistribution = [];
  const pagoCashById = {};
  orderedByEligible.forEach((p) => {
    const give = Math.max(0, Math.min(p.cashEligible, remainingPool));
    pagoCashById[p.playerId] = round1(give);
    if (give > 0) cashDistribution.push({ playerId: p.playerId, name: p.name, amount: round1(give) });
    remainingPool = round1(remainingPool - give);
  });
  // Si después de pagarle a todos los que tienen saldo elegible todavía sobra efectivo
  // (por ejemplo, por un descuadre de redondeo), ese sobrante no se queda sin asignar:
  // se le suma directamente a quien más ganó, en vez de al que sigue en la fila.
  if (remainingPool > 0 && orderedByEligible.length > 0) {
    const topWinner = orderedByEligible[0];
    pagoCashById[topWinner.playerId] = round1((pagoCashById[topWinner.playerId] || 0) + remainingPool);
    const existing = cashDistribution.find((x) => x.playerId === topWinner.playerId);
    if (existing) existing.amount = round1(existing.amount + remainingPool);
    else cashDistribution.push({ playerId: topWinner.playerId, name: topWinner.name, amount: round1(remainingPool) });
    remainingPool = 0;
  }
  const cashDistributed = cashDistribution.reduce((s, x) => s + x.amount, 0);

  const players = base.map((p) => {
    const pagoCash = pagoCashById[p.playerId] || 0;
    const pagoTransfer = round1(p.diff - pagoCash);
    const pagoCashLabel = pagoCash < 0 ? "Debe cash" : pagoCash > 0 ? "Recibe cash" : "Cash";
    const pagoTransferLabel = pagoTransfer < 0 ? "Debe transfer" : pagoTransfer > 0 ? "Recibe transfer" : "Transfer";
    return { ...p, pagoCash, pagoTransfer, pagoCashLabel, pagoTransferLabel };
  });

  // TRANSFERENCIAS SUGERIDAS: ordenadas de mayor a menor por "Recibe transfer"; cada
  // deudor (mayor a menor) paga primero al mayor acreedor hasta saldarlo, para que
  // transfiera al menor número de personas posible.
  const creditors = players
    .filter((p) => p.pagoTransfer > 0)
    .map((p) => ({ playerId: p.playerId, name: p.name, amount: p.pagoTransfer }))
    .sort((a, b) => b.amount - a.amount);
  const debtors = players
    .filter((p) => p.pagoTransfer < 0)
    .map((p) => ({ playerId: p.playerId, name: p.name, amount: -p.pagoTransfer }))
    .sort((a, b) => b.amount - a.amount);

  const transfers = [];
  let i = 0, j = 0;
  while (i < debtors.length && j < creditors.length) {
    const d = debtors[i], c = creditors[j];
    const amt = round1(Math.min(d.amount, c.amount));
    if (amt > 0) transfers.push({ from: d.name, fromId: d.playerId, to: c.name, toId: c.playerId, amount: amt });
    d.amount = round1(d.amount - amt);
    c.amount = round1(c.amount - amt);
    if (d.amount <= 0) i++;
    if (c.amount <= 0) j++;
  }

  return { players, rake, totalCashAll, cashPool, cashDistribution, cashDistributed, transfers };
}
function round1(n) { return Math.round(n); }

/* ----------------------------------------------------------------------
   ROOT APP
---------------------------------------------------------------------- */
function PokerLedger() {
  const [loading, setLoading] = useState(true);
  const [roster, setRoster] = useState([]);
  const [games, setGames] = useState([]);
  const [activeGame, setActiveGame] = useState(null);
  const [tab, setTab] = useState("partida");
  const [lastSync, setLastSync] = useState(Date.now());
  const [syncing, setSyncing] = useState(false);
  const [syncError, setSyncError] = useState(null);

  // Si hay una partida en curso, la pestaña "Jugadores" queda oculta (no se debe
  // editar el roster a mitad de una partida); si alguien estaba justo ahí cuando
  // arrancó una partida, lo mandamos de vuelta a la pestaña de la partida.
  useEffect(() => {
    if (activeGame && !activeGame.finished && tab === "jugadores") setTab("partida");
  }, [activeGame, tab]);

  // Evita que una sincronización pise ediciones locales muy recientes que todavía no
  // le dieron tiempo a la hoja de reflejarse (p. ej. crear la partida y sincronizar
  // casi al instante): mientras una edición local esté "fresca", esa sincronización
  // en particular no la reemplaza. syncApplyingRef distingue cuándo un cambio de
  // estado vino de la propia sincronización (no cuenta como "edición local" y no
  // hace falta re-guardarlo, ya que se acaba de leer tal cual de la hoja).
  const lastLocalEditRef = useRef({ roster: 0, games: 0, activeGame: 0 });
  const syncApplyingRef = useRef(false);
  const SYNC_GRACE_MS = 8000;

  // "loaded" marca, por separado para cada parte, si ya se logró una lectura exitosa
  // de la hoja al menos una vez. El guardado automático de una parte queda BLOQUEADO
  // hasta que loaded.esa_parte sea true — así, si justo al abrir/refrescar la app
  // falla la lectura por mala señal, ese fallo nunca se confunde con "está vacío" y
  // nunca se guarda por accidente encima de los datos reales de la hoja.
  const [loaded, setLoaded] = useState({ roster: false, games: false, activeGame: false });

  useEffect(() => {
    (async () => {
      const results = await Promise.allSettled([loadRoster(), loadGames(), loadActiveGame()]);
      const [rRes, gRes, aRes] = results;
      const failed = [];
      if (rRes.status === "fulfilled") { setRoster(rRes.value); setLoaded((l) => ({ ...l, roster: true })); }
      else failed.push("Jugadores");
      if (gRes.status === "fulfilled") { setGames(gRes.value); setLoaded((l) => ({ ...l, games: true })); }
      else failed.push("Historial");
      if (aRes.status === "fulfilled") { setActiveGame(aRes.value); setLoaded((l) => ({ ...l, activeGame: true })); }
      else failed.push("Partida activa");
      if (failed.length) {
        const reasons = [rRes, gRes, aRes]
          .filter((x) => x.status === "rejected")
          .map((x) => (x.reason && x.reason.message) || String(x.reason));
        const uniqueReasons = [...new Set(reasons)];
        console.error("carga inicial falló para:", failed, reasons);
        setSyncError(
          "No se pudo cargar: " + failed.join(", ") + ". " + uniqueReasons.join(" | ") +
          " — No se va a guardar nada hasta lograr una lectura exitosa. Presiona Sincronizar para reintentar."
        );
      }
      setLoading(false);
    })();
  }, []);
  useEffect(() => {
    if (loading || !loaded.roster) return;
    if (syncApplyingRef.current) return; // esto vino de sincronizar, no de una edición local
    lastLocalEditRef.current.roster = Date.now();
    saveRoster(roster).catch((e) => { console.error(e); setSyncError(String((e && e.message) || e)); });
  }, [roster, loading, loaded.roster]);
  useEffect(() => {
    if (loading || !loaded.games) return;
    if (syncApplyingRef.current) return;
    lastLocalEditRef.current.games = Date.now();
    saveGames(games).catch((e) => { console.error(e); setSyncError(String((e && e.message) || e)); });
  }, [games, loading, loaded.games]);
  useEffect(() => {
    if (loading || !loaded.activeGame) return;
    if (syncApplyingRef.current) return;
    lastLocalEditRef.current.activeGame = Date.now();
    saveActiveGame(activeGame).catch((e) => { console.error(e); setSyncError(String((e && e.message) || e)); });
  }, [activeGame, loading, loaded.activeGame]);

  // Sincronización manual: la Google Sheet es la fuente compartida. En vez de sondear
  // automáticamente cada N segundos, el usuario presiona el botón "Sincronizar" para
  // traer los cambios más recientes de otros dispositivos cuando lo necesite.
  const syncNow = useCallback(async () => {
    setSyncing(true);
    setSyncError(null);
    try {
      const results = await Promise.allSettled([loadRoster(), loadGames(), loadActiveGame()]);
      const [rRes, gRes, aRes] = results;
      const now = Date.now();
      syncApplyingRef.current = true;
      const failed = [];
      // Candado de seguridad: si la hoja "responde" vacía para algo que localmente
      // sí tiene datos, lo más probable es una lectura a mitad de una escritura de
      // otro dispositivo (o un error de red), no que de verdad se haya vaciado todo.
      // En ese caso se ignora esa parte de la sincronización en vez de borrar la app.
      // Y si hubo una edición local hace muy poco, tampoco se pisa: probablemente la
      // hoja todavía no la refleja.
      if (rRes.status === "fulfilled") {
        const r = rRes.value;
        setRoster((cur) => {
          if (now - lastLocalEditRef.current.roster < SYNC_GRACE_MS) return cur;
          if (r.length === 0 && cur.length > 0) { console.warn("sync: Roster llegó vacío, se ignora"); return cur; }
          return JSON.stringify(cur) === JSON.stringify(r) ? cur : r;
        });
        setLoaded((l) => ({ ...l, roster: true }));
      } else failed.push("Jugadores");
      if (gRes.status === "fulfilled") {
        const g = gRes.value;
        setGames((cur) => {
          if (now - lastLocalEditRef.current.games < SYNC_GRACE_MS) return cur;
          if (g.length === 0 && cur.length > 0) { console.warn("sync: Games llegó vacío, se ignora"); return cur; }
          return JSON.stringify(cur) === JSON.stringify(g) ? cur : g;
        });
        setLoaded((l) => ({ ...l, games: true }));
      } else failed.push("Historial");
      if (aRes.status === "fulfilled") {
        const a = aRes.value;
        setActiveGame((cur) => {
          if (now - lastLocalEditRef.current.activeGame < SYNC_GRACE_MS) return cur;
          return JSON.stringify(cur) === JSON.stringify(a) ? cur : a;
        });
        setLoaded((l) => ({ ...l, activeGame: true }));
      } else failed.push("Partida activa");
      setLastSync(Date.now());
      if (failed.length) {
        const reasons = [rRes, gRes, aRes]
          .filter((x) => x.status === "rejected")
          .map((x) => (x.reason && x.reason.message) || String(x.reason));
        const uniqueReasons = [...new Set(reasons)];
        console.error("sync failed for", failed, reasons);
        setSyncError("No se pudo traer: " + failed.join(", ") + ". " + uniqueReasons.join(" | "));
      }
      // Deja pasar el render + los efectos de guardado (que verán syncApplyingRef en
      // true y no van a re-disparar un guardado innecesario) antes de "soltar" el flag.
      setTimeout(() => { syncApplyingRef.current = false; }, 50);
    } catch (e) {
      console.error("sync failed", e);
      setSyncError(String((e && e.message) || e));
      syncApplyingRef.current = false;
    } finally {
      setSyncing(false);
    }
  }, []);

  const playerStats = useCallback(
    (playerId) => {
      let played = 0, wins = 0, balance = 0, cashInTotal = 0, virtualInTotal = 0;
      games.forEach((g) => {
        const res = computeSettlement(g, roster).players.find((p) => p.playerId === playerId);
        if (res) {
          played++; balance += res.balance;
          if (res.balance > 0) wins++;
          cashInTotal += res.cashAmount; virtualInTotal += res.virtualAmount;
        }
      });
      return { played, wins, balance, cashInTotal, virtualInTotal };
    },
    [games, roster]
  );

  if (loading) {
    return (
      <div style={{ background: C.felt, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center" }}>
        <div style={{ ...displayFont, color: C.goldSoft, fontSize: 28 }}>Repartiendo cartas…</div>
      </div>
    );
  }

  return (
    <div style={{ minHeight: "100vh", background: `radial-gradient(ellipse at top, ${C.panel} 0%, ${C.felt} 45%, ${C.feltDeep} 100%)`, ...bodyFont }}>
      <style>{`
        ${FONT_IMPORT}
        * { box-sizing: border-box; }
        body { margin:0; }
        input[type=number]::-webkit-inner-spin-button { opacity: 1; }
        .felt-line { border-color: ${C.feltLine}; }
        ::selection { background: ${C.gold}; color: ${C.ink}; }
        button:focus-visible, input:focus-visible, select:focus-visible {
          outline: 2px solid ${C.gold}; outline-offset: 2px;
        }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; height:6px; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: ${C.panelLine}; border-radius: 3px; }
      `}</style>

      <Header tab={tab} setTab={setTab} hasActive={!!activeGame && !activeGame.finished} lastSync={lastSync} syncNow={syncNow} syncing={syncing} syncError={syncError} />

      <main style={{ maxWidth: 720, margin: "0 auto", padding: "14px 10px 60px" }}>
        {!!activeGame && !activeGame.finished && (
          <div style={{
            display: "flex", alignItems: "center", gap: 8, marginBottom: 14,
            background: "rgba(216,173,63,0.14)", border: `1px solid ${C.gold}`,
            borderRadius: 10, padding: "9px 12px",
          }}>
            <span style={{ width: 8, height: 8, borderRadius: 99, background: C.win, flexShrink: 0, boxShadow: "0 0 0 3px rgba(63,191,114,0.25)" }} />
            <span style={{ ...displayFont, fontSize: 15, color: C.goldSoft, letterSpacing: "0.04em" }}>Jugada en Curso</span>
          </div>
        )}
        {tab === "jugadores" && !(!!activeGame && !activeGame.finished) && (
          <PlayersTab roster={roster} setRoster={setRoster} playerStats={playerStats} />
        )}
        {tab === "partida" && (
          <GameTab
            roster={roster}
            activeGame={activeGame}
            setActiveGame={setActiveGame}
            games={games}
            setGames={setGames}
          />
        )}
        {tab === "historial" && <HistoryTab games={games} setGames={setGames} roster={roster} />}
      </main>
    </div>
  );
}

function formatAgo(ms) {
  const secs = Math.max(0, Math.round(ms / 1000));
  if (secs < 2) return "actualizado ahora";
  if (secs < 60) return `hace ${secs}s`;
  const mins = Math.round(secs / 60);
  if (mins < 60) return `hace ${mins}min`;
  const hours = Math.round(mins / 60);
  if (hours < 24) return `hace ${hours}h`;
  const days = Math.round(hours / 24);
  return `hace ${days}d`;
}
function Header({ tab, setTab, hasActive, lastSync, syncNow, syncing, syncError }) {

    const t = setInterval(() => forceTick((n) => n + 1), 1000);
    return () => clearInterval(t);

  const agoLabel = formatAgo(Date.now() - (lastSync || Date.now()));
  const tabs = hasActive
    ? [
        { id: "partida", label: "Estatus jugada", icon: Activity },
        { id: "historial", label: "Información histórica", icon: History },

    : [

          <div style={{ display: "flex", alignItems: "baseline", gap: 8, minWidth: 0 }}>
            <span style={{ ...displayFont, fontSize: 26, color: C.gold, lineHeight: 1 }}>BARILOCHE</span>
            <span style={{ ...bodyFont, fontSize: 10.5, color: "rgba(240,216,136,0.55)", letterSpacing: "0.12em", textTransform: "uppercase" }}>
              registro de poker
            </span>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 6, flexShrink: 0 }}>
            <a
              href="./dashboard.html"
              title="Ver estadísticas históricas"
              style={{
                display: "flex", alignItems: "center", gap: 5, textDecoration: "none",
                background: "rgba(244,234,214,0.08)", border: `1px solid ${C.panelLine}`,
                borderRadius: 8, padding: "6px 9px", color: "rgba(244,234,214,0.75)",
                fontSize: 11, ...bodyFont, fontWeight: 600,
              }}
            >
              📊 Stats
            </a>
            <button
              onClick={syncNow}

                background: syncError ? "rgba(200,80,70,0.18)" : "rgba(244,234,214,0.08)",
                border: `1px solid ${syncError ? "rgba(200,80,70,0.4)" : C.panelLine}`,
                borderRadius: 8, padding: "6px 9px",
                cursor: syncing ? "default" : "pointer",
                color: syncError ? "#e6a79c" : "rgba(244,234,214,0.75)",
                fontSize: 11, ...bodyFont, fontWeight: 600,
              }}
            >

                ⟳
              </span>

            </button>

        </div>
        <div style={{ textAlign: "right", marginTop: 2 }}>
          <span style={{ fontSize: 10, color: "rgba(244,234,214,0.4)", ...bodyFont }}>

function PlayersTab({ roster, setRoster, playerStats }) {
  const [selId, setSelId] = useState("");
  const [newName, setNewName] = useState("");
  const [newAvatar, setNewAvatar] = useState(null);
  const [editName, setEditName] = useState("");
  const [editAvatar, setEditAvatar] = useState(null);

  const sel = roster.find((p) => p.id === selId) || null;
  useEffect(() => { setEditName(sel ? sel.name : ""); setEditAvatar(sel ? sel.avatar || null : null); }, [selId]); // eslint-disable-line

  const addPlayer = () => {
    const name = newName.trim();
    if (!name) return;
    const p = { id: uid(), name, active: true, avatar: newAvatar, createdAt: Date.now() };
    setRoster((r) => [...r, p]);
    setNewName(""); setNewAvatar(null);
  };
  const saveEdit = () => {
    if (!sel || !editName.trim()) return;
    setRoster((r) => r.map((p) => (p.id === sel.id ? { ...p, name: editName.trim(), avatar: editAvatar } : p)));
  };
  const toggleActive = () => {
    if (!sel) return;
    setRoster((r) => r.map((p) => (p.id === sel.id ? { ...p, active: !p.active } : p)));
  };
  const removePlayer = () => {
    if (!sel) return;
    if (!confirm(`¿Eliminar a ${sel.name} del roster? Sus estadísticas históricas se conservarán en partidas guardadas, pero dejará de aparecer en la lista.`)) return;
    setRoster((r) => r.filter((p) => p.id !== sel.id));
    setSelId("");
  };

  const sorted = [...roster].sort((a, b) => a.name.localeCompare(b.name));

  return (
    <div style={{ display: "grid", gap: 16 }}>
      <Panel>
        <SectionTitle icon={UserPlus}>Alta de jugador</SectionTitle>
        <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
          <input
            style={inputStyle} placeholder="Nombre del jugador" value={newName}
            onChange={(e) => setNewName(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && addPlayer()}
          />
          <PrimaryBtn onClick={addPlayer} icon={Plus}>Agregar</PrimaryBtn>
        </div>
        <AvatarPicker avatar={newAvatar} setAvatar={setNewAvatar} previewName={newName} />
      </Panel>

      <Panel>
        <SectionTitle icon={Pencil}>Editar / dar de baja</SectionTitle>
        <Field label="Seleccionar jugador">
          <select style={{ ...inputStyle, appearance: "auto" }} value={selId} onChange={(e) => setSelId(e.target.value)}>
            <option value="">— elegir del combo —</option>
            {sorted.map((p) => (
              <option key={p.id} value={p.id}>{p.name}{!p.active ? " (baja)" : ""}</option>
            ))}
          </select>
        </Field>

        {sel && (
          <div style={{ marginTop: 14, display: "grid", gap: 10 }}>
            <div style={{ display: "flex", gap: 8 }}>
              <input style={inputStyle} value={editName} onChange={(e) => setEditName(e.target.value)} />
              <GhostBtn onClick={saveEdit} icon={Check} color={C.win}>Guardar</GhostBtn>
            </div>
            <AvatarPicker avatar={editAvatar} setAvatar={setEditAvatar} previewName={editName} />
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <GhostBtn onClick={toggleActive} icon={sel.active ? UserX : UserCheck} color={sel.active ? C.loss : C.win}>
                {sel.active ? "Dar de baja" : "Reactivar"}
              </GhostBtn>
              <GhostBtn onClick={removePlayer} icon={Trash2} color={C.loss}>Eliminar del roster</GhostBtn>
            </div>
            <PlayerStatRow stats={playerStats(sel.id)} />
          </div>
        )}
      </Panel>

      <Panel>
        <SectionTitle icon={Users} right={<span style={{ color: "rgba(244,234,214,0.5)", fontSize: 12 }}>{roster.filter(p=>p.active).length} activos</span>}>
          Roster completo
        </SectionTitle>
        <div style={{ display: "grid", gap: 8 }}>
          {sorted.length === 0 && <Empty>Aún no hay jugadores. Agrega el primero arriba.</Empty>}
          {sorted.map((p) => {
            const st = playerStats(p.id);
            return (
              <div key={p.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: "rgba(0,0,0,0.18)", borderRadius: 10, padding: "10px 12px", opacity: p.active ? 1 : 0.5 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <Avatar player={p} size={30} />
                  <div>
                    <div style={{ color: C.card, fontWeight: 600, fontSize: 14 }}>{p.name}{!p.active && <span style={{ color: C.loss, fontSize: 11, marginLeft: 6 }}>BAJA</span>}</div>
                    <div style={{ color: "rgba(244,234,214,0.55)", fontSize: 11.5, ...monoFont }}>{st.played} partidas · {st.wins} ganadas</div>
                  </div>
                </div>
                <div style={{ textAlign: "right", ...monoFont, fontWeight: 700, fontSize: 14, color: st.balance > 0 ? C.win : st.balance < 0 ? C.loss : "rgba(244,234,214,0.6)" }}>
                  {money(st.balance)}
                </div>
              </div>
            );
          })}
        </div>
      </Panel>
    </div>
  );
}

function GameTab({ roster, activeGame, setActiveGame, games, setGames }) {
  if (!activeGame) return <NewGameSetup roster={roster} setActiveGame={setActiveGame} />;
  if (activeGame.finished) {
    return (
      <FinalizedGame
        game={activeGame}
        roster={roster}
        onClose={() => setActiveGame(null)}
        onEdit={() => {
          setGames((gs) => gs.filter((g) => g.id !== activeGame.id));
          setActiveGame((g) => ({ ...g, finished: false }));
        }}
      />
    );
  }
  return <ActiveGameScreen game={activeGame} setGame={setActiveGame} roster={roster} setGames={setGames} />;
}

function NewGameSetup({ roster, setActiveGame }) {
  const active = roster.filter((p) => p.active);
  const [date, setDate] = useState(todayISO());
  const [loteValue, setLoteValue] = useState(500);
  const RAKE_FIJO = 1000; // el rake queda fijo para todas las partidas
  const [selected, setSelected] = useState([]);
  const [hostId, setHostId] = useState("");

  const toggle = (id) => {
    setSelected((s) => (s.includes(id) ? s.filter((x) => x !== id) : [...s, id]));
    if (hostId === id) setHostId("");
  };

  const start = () => {
    if (selected.length < 2 || !loteValue || !hostId) return;
    setActiveGame({
      id: uid(), date, loteValue: Number(loteValue), rake: RAKE_FIJO,
      playerIds: selected, hostId, startedAt: Date.now(),
      purchases: [],
      dinner: { total: 0, waiter: 0, alcoholFee: 0, alcohol: {}, paid: {}, paymentMethod: {} },
      finalChips: {}, finished: false, results: null,
    });
  };

  return (
    <div style={{ display: "grid", gap: 16 }}>
      <Panel>
        <SectionTitle icon={Play}>Nueva partida</SectionTitle>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          <Field label="Fecha">
            <input type="date" style={inputStyle} value={date} onChange={(e) => setDate(e.target.value)} />
          </Field>
          <Field label="Valor del lote">
            <input type="number" min="0" style={inputStyle} value={loteValue} onChange={(e) => setLoteValue(e.target.value)} />
          </Field>
        </div>
        <div style={{ marginTop: 10 }}>
          <Field label="Rake 🔒">
            <div style={{ ...inputStyle, display: "flex", alignItems: "center", color: "rgba(244,234,214,0.75)", opacity: 0.75 }}>
              {money(RAKE_FIJO)}
            </div>
          </Field>
        </div>
      </Panel>

      <Panel>
        <SectionTitle icon={Users} right={<span style={{ fontSize: 12, color: "rgba(244,234,214,0.5)" }}>{selected.length} seleccionados</span>}>
          Jugadores en la mesa
        </SectionTitle>
        {active.length === 0 ? (
          <Empty>No hay jugadores activos. Ve a la pestaña Jugadores para dar de alta.</Empty>
        ) : (
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            {active.map((p) => {
              const on = selected.includes(p.id);
              return (
                <button key={p.id} onClick={() => toggle(p.id)}
                  style={{
                    display: "flex", alignItems: "center", gap: 8, textAlign: "left",
                    background: on ? "rgba(216,173,63,0.16)" : "rgba(0,0,0,0.18)",
                    border: `1px solid ${on ? C.gold : C.panelLine}`, borderRadius: 9,
                    padding: "9px 10px", cursor: "pointer", ...bodyFont,
                  }}>
                  <div style={{ width: 18, height: 18, borderRadius: 5, border: `1.5px solid ${on ? C.gold : "rgba(244,234,214,0.4)"}`, background: on ? C.gold : "transparent", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                    {on && <Check size={12} color={C.ink} />}
                  </div>
                  <Avatar player={p} size={22} />
                  <span style={{ color: C.card, fontSize: 13.5, fontWeight: 600 }}>{p.name}</span>
                </button>
              );
            })}
          </div>
        )}
      </Panel>

      {selected.length >= 1 && (
        <Panel>
          <SectionTitle icon={Crown}>Host / administrador de la partida</SectionTitle>
          <div style={{ color: "rgba(244,234,214,0.55)", fontSize: 12, marginBottom: 10 }}>
            Selecciona un único jugador que administrará la partida.
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            {selected.map((id) => {
              const p = active.find((x) => x.id === id) || roster.find((x) => x.id === id);
              if (!p) return null;
              const on = hostId === id;
              return (
                <button key={id} onClick={() => setHostId(id)}
                  style={{
                    display: "flex", alignItems: "center", gap: 8, textAlign: "left",
                    background: on ? "rgba(216,173,63,0.22)" : "rgba(0,0,0,0.18)",
                    border: `1px solid ${on ? C.gold : C.panelLine}`, borderRadius: 9,
                    padding: "9px 10px", cursor: "pointer", ...bodyFont,
                  }}>
                  <div style={{ width: 16, height: 16, borderRadius: 99, border: `1.5px solid ${on ? C.gold : "rgba(244,234,214,0.4)"}`, background: on ? C.gold : "transparent", flexShrink: 0 }} />
                  <Avatar player={p} size={22} />
                  <span style={{ color: C.card, fontSize: 13.5, fontWeight: 600 }}>{p.name}</span>
                  {on && <Crown size={13} color={C.gold} style={{ marginLeft: "auto" }} />}
                </button>
              );
            })}
          </div>
        </Panel>
      )}

      <PrimaryBtn onClick={start} disabled={selected.length < 2 || !loteValue || !hostId} icon={Play} style={{ padding: "13px 18px", fontSize: 15 }}>
        Iniciar partida
      </PrimaryBtn>
      {selected.length < 2 && <div style={{ color: "rgba(244,234,214,0.5)", fontSize: 12.5, textAlign: "center" }}>Selecciona al menos 2 jugadores.</div>}
      {selected.length >= 2 && !hostId && <div style={{ color: "rgba(244,234,214,0.5)", fontSize: 12.5, textAlign: "center" }}>Selecciona quién será el host.</div>}
    </div>
  );
}

/* ----- Active game: buy-ins, dinner, finalize ----- */
function useTicker(intervalMs) {
  const [, tick] = useState(0);
  useEffect(() => {
    const t = setInterval(() => tick((n) => n + 1), intervalMs);
    return () => clearInterval(t);
  }, [intervalMs]);
}
function formatElapsed(ms) {
  const totalSec = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const pad = (n) => String(n).padStart(2, "0");
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}
function formatClock(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  return d.toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });
}

function GameStatusBlock({ game, players, totals }) {
  useTicker(1000);
  const lotesTotal = game.purchases.reduce((s, p) => s + p.lotes, 0);
  const lotesProm = players.length ? round1(lotesTotal / players.length) : 0;
  const elapsed = game.startedAt ? Date.now() - game.startedAt : null;

  const perPlayer = players.map((p) => {
    const cash = game.purchases.filter((pu) => pu.playerId === p.id && pu.type === "cash").reduce((s, pu) => s + pu.amount, 0);
    const virtual = game.purchases.filter((pu) => pu.playerId === p.id && pu.type === "virtual").reduce((s, pu) => s + pu.amount, 0);
    return { player: p, cash, virtual, total: cash + virtual };
  }).sort((a, b) => b.total - a.total);

  return (
    <Panel>
      <SectionTitle icon={Activity}>Estatus de la jugada</SectionTitle>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 6, marginBottom: 10 }}>
        <ScoreBox label="Rake" value={money(game.rake)} />
        <ScoreBox label="Jugadores" value={players.length} />
        <ScoreBox label="Hora inicio" value={formatClock(game.startedAt)} />
        <ScoreBox label="Tiempo jugado" value={elapsed == null ? "—" : formatElapsed(elapsed)} />
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 6, marginBottom: 12 }}>
        <ScoreBox label="Total cash" value={money(totals.cash)} tone="cash" />
        <ScoreBox label="Total virtual" value={money(totals.virtual)} tone="virtual" />
        <ScoreBox label="Lotes prom./jugador" value={lotesProm} />
      </div>
      <div style={{ display: "grid", gap: 6 }}>
        {perPlayer.map((row) => (
          <div key={row.player.id} style={{ display: "flex", alignItems: "center", gap: 8, background: "rgba(0,0,0,0.18)", borderRadius: 8, padding: "7px 10px" }}>
            <Avatar player={row.player} size={22} />
            <span style={{ color: C.card, fontWeight: 600, fontSize: 13, flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{row.player.name}</span>
            <span style={{ ...monoFont, fontSize: 11.5, color: C.cash, flexShrink: 0 }}>{money(row.cash)}</span>
            <span style={{ ...monoFont, fontSize: 11.5, color: C.virtual, flexShrink: 0 }}>{money(row.virtual)}</span>
            <span style={{ ...monoFont, fontSize: 12.5, color: C.goldSoft, fontWeight: 700, flexShrink: 0, width: 64, textAlign: "right" }}>{money(row.total)}</span>
          </div>
        ))}
      </div>
      <div style={{ display: "flex", gap: 12, marginTop: 6, fontSize: 10, color: "rgba(244,234,214,0.4)", justifyContent: "flex-end" }}>
        <span>cash</span><span>virtual</span><span>total</span>
      </div>
    </Panel>
  );
}

function ActiveGameScreen({ game, setGame, roster, setGames }) {
  const [dinnerOpen, setDinnerOpen] = useState(false);
  const [finalizing, setFinalizing] = useState(() => Object.keys(game.finalChips || {}).length > 0);
  const [view, setView] = useState("purchase"); // "config" | "purchase"

  const players = game.playerIds.map((id) => roster.find((r) => r.id === id)).filter(Boolean);
  const availableToAdd = roster.filter((p) => p.active && !game.playerIds.includes(p.id));

  const update = (patch) => setGame((g) => ({ ...g, ...patch }));

  const addPurchase = (playerId, type, qty) => {
    const lotes = Number(qty) || 0;
    if (lotes <= 0) return;
    const entry = { id: uid(), playerId, type, lotes, amount: lotes * game.loteValue, ts: Date.now() };
    update({ purchases: [...game.purchases, entry] });
  };
  const removePurchase = (id) => update({ purchases: game.purchases.filter((p) => p.id !== id) });

  const totals = useMemo(() => {
    let cash = 0, virtual = 0;
    game.purchases.forEach((p) => { if (p.type === "cash") cash += p.amount; else virtual += p.amount; });
    return { cash, virtual };
  }, [game.purchases]);

  const setLote = (v) => update({ loteValue: Number(v) || 0 });
  const setRake = (v) => update({ rake: Number(v) || 0 });
  const rakeLocked = Object.keys(game.finalChips || {}).length > 0;

  const addPlayerToGame = (id) => {
    if (game.playerIds.includes(id)) return;
    update({ playerIds: [...game.playerIds, id] });
  };
  const removePlayerFromGame = (id) => {
    const hasPurchases = game.purchases.some((p) => p.playerId === id);
    const name = roster.find((r) => r.id === id)?.name || "este jugador";
    if (hasPurchases) {
      const ok = confirm(
        `⚠️ ${name} ya tiene lotes comprados registrados en esta partida. Si lo quitas, esas compras se van a eliminar también. ¿Continuar?`
      );
      if (!ok) return;
    } else if (!confirm(`¿Quitar a ${name} de esta partida?`)) {
      return;
    }
    update({
      playerIds: game.playerIds.filter((pid) => pid !== id),
      purchases: game.purchases.filter((p) => p.playerId !== id),
      hostId: game.hostId === id ? "" : game.hostId,
    });
  };

  if (finalizing) {
    return (
      <FinalizeGame
        game={game} roster={roster}
        onBack={() => setFinalizing(false)}
        onConfirm={(finalChips) => {
          const g2 = { ...game, finalChips };
          const results = computeSettlement(g2, roster);
          const finished = { ...g2, finished: true, results };
          setGame(finished);
          setGames((gs) => [...gs, finished]);
        }}
      />
    );
  }

  if (view === "config") {
    return (
      <div style={{ display: "grid", gap: 16 }}>
        <GameStatusBlock game={game} players={players} totals={totals} />
        <Panel>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 10 }}>
            <div>
              <div style={{ ...displayFont, fontSize: 24, color: C.goldSoft }}>Configuración de la partida</div>
              <div style={{ color: "rgba(244,234,214,0.55)", fontSize: 12.5, ...monoFont }}>{game.date}</div>
            </div>
            <GhostBtn icon={X} color={C.loss} onClick={() => { if (confirm("¿Cancelar esta partida? Se perderá el progreso.")) setGame(null); }}>
              Cancelar partida
            </GhostBtn>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 14 }}>
            <Field label="Valor de lote"><input type="number" style={inputStyle} value={game.loteValue} onChange={(e) => setLote(e.target.value)} /></Field>
            <Field label={rakeLocked ? "Rake 🔒" : "Rake"}>
              <input
                type="number" style={{ ...inputStyle, opacity: rakeLocked ? 0.55 : 1, cursor: rakeLocked ? "not-allowed" : "text" }}
                value={game.rake} disabled={rakeLocked}
                onChange={(e) => setRake(e.target.value)}
                title={rakeLocked ? "El rake queda fijo una vez que se hizo la entrega de fichas." : undefined}
              />
            </Field>
          </div>
        </Panel>

        <Panel>
          <SectionTitle icon={Users}>Jugadores en la mesa ({players.length})</SectionTitle>
          <div style={{ display: "grid", gap: 8 }}>
            {players.map((p) => {
              const hasPurchases = game.purchases.some((pu) => pu.playerId === p.id);
              return (
                <div key={p.id} style={{ display: "flex", alignItems: "center", gap: 8, background: "rgba(0,0,0,0.18)", borderRadius: 9, padding: "8px 10px" }}>
                  <Avatar player={p} size={24} />
                  <span style={{ color: C.card, fontWeight: 600, fontSize: 13.5, flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.name}</span>
                  {game.hostId === p.id && <Badge tone="gold"><Crown size={10} /> Host</Badge>}
                  {hasPurchases && <span title="Ya tiene lotes comprados" style={{ fontSize: 10.5, color: "rgba(244,234,214,0.4)" }}>tiene lotes</span>}
                  <button onClick={() => removePlayerFromGame(p.id)} title="Quitar de la partida" style={{ background: "transparent", border: "none", cursor: "pointer", color: "rgba(226,99,79,0.75)", padding: 4, flexShrink: 0 }}>
                    <Trash2 size={15} />
                  </button>
                </div>
              );
            })}
          </div>
          {availableToAdd.length > 0 && (
            <div style={{ marginTop: 12 }}>
              <div style={{ fontSize: 11.5, color: "rgba(244,234,214,0.5)", marginBottom: 6 }}>Agregar a la mesa:</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                {availableToAdd.map((p) => (
                  <button key={p.id} onClick={() => addPlayerToGame(p.id)}
                    style={{ display: "flex", alignItems: "center", gap: 8, textAlign: "left", background: "rgba(0,0,0,0.18)", border: `1px solid ${C.panelLine}`, borderRadius: 9, padding: "8px 10px", cursor: "pointer", ...bodyFont }}>
                    <Avatar player={p} size={20} />
                    <span style={{ color: C.card, fontSize: 13 }}>{p.name}</span>
                    <Plus size={13} color={C.goldSoft} style={{ marginLeft: "auto", flexShrink: 0 }} />
                  </button>
                ))}
              </div>
            </div>
          )}
        </Panel>

        <PrimaryBtn onClick={() => setView("purchase")} icon={Banknote} style={{ padding: "13px 18px", fontSize: 15 }}>
          Continuar a compra de lotes
        </PrimaryBtn>
      </div>
    );
  }

  return (
    <div style={{ display: "grid", gap: 16 }}>
      <GameStatusBlock game={game} players={players} totals={totals} />

      <Panel>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 10 }}>
          <div>
            <div style={{ ...displayFont, fontSize: 24, color: C.goldSoft }}>Partida en curso</div>
            <div style={{ color: "rgba(244,234,214,0.55)", fontSize: 12.5, ...monoFont, display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
              <span>{game.date} · {players.length} jugadores</span>
              {game.hostId && (
                <span style={{ display: "inline-flex", alignItems: "center", gap: 4, background: "rgba(216,173,63,0.16)", color: C.goldSoft, padding: "2px 7px", borderRadius: 99 }}>
                  <Crown size={11} /> Host: {roster.find((r) => r.id === game.hostId)?.name || "—"}
                </span>
              )}
            </div>
          </div>
          <GhostBtn icon={Settings} onClick={() => setView("config")}>
            Configuración
          </GhostBtn>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 8, marginTop: 14 }}>
          <ScoreBox label="Lote" value={money(game.loteValue)} />
          <ScoreBox label="Cash" value={money(totals.cash)} tone="cash" />
          <ScoreBox label="Virtual" value={money(totals.virtual)} tone="virtual" />
          <ScoreBox label="Rake" value={money(game.rake)} />
        </div>
      </Panel>

      <Panel>
        <SectionTitle icon={Banknote}>Compra de lotes por jugador</SectionTitle>
        <div style={{ display: "grid", gap: 10 }}>
          {players.map((p) => (
            <PlayerBuyRow key={p.id} player={p} game={game} onAdd={addPurchase} onRemove={removePurchase} />
          ))}
        </div>
      </Panel>

      <Panel>
        <button onClick={() => setDinnerOpen((o) => !o)} style={{ width: "100%", background: "transparent", border: "none", cursor: "pointer", padding: 0 }}>
          <SectionTitle icon={UtensilsCrossed} right={dinnerOpen ? <ChevronUp size={16} color={C.goldSoft} /> : <ChevronDown size={16} color={C.goldSoft} />}>
            Cena y servicio
          </SectionTitle>
        </button>
        {dinnerOpen && <DinnerSection game={game} players={players} update={update} />}
      </Panel>

      <PrimaryBtn onClick={() => setFinalizing(true)} icon={Square} style={{ padding: "13px 18px", fontSize: 15 }}>
        Finalizar partida
      </PrimaryBtn>
    </div>
  );
}

function ScoreBox({ label, value, tone }) {
  const color = tone === "cash" ? C.cash : tone === "virtual" ? C.virtual : C.goldSoft;
  return (
    <div style={{ background: "rgba(0,0,0,0.22)", borderRadius: 9, padding: "7px 4px", textAlign: "center", minWidth: 0 }}>
      <div style={{ fontSize: 9.5, color: "rgba(244,234,214,0.5)", textTransform: "uppercase", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{label}</div>
      <div style={{ ...monoFont, fontWeight: 700, fontSize: 13, color, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{value}</div>
    </div>
  );
}

function PlayerBuyRow({ player, game, onAdd, onRemove }) {
  const [qtyCash, setQtyCash] = useState(1);
  const [qtyVirtual, setQtyVirtual] = useState(1);
  const entries = game.purchases.filter((p) => p.playerId === player.id);
  const cashLotes = entries.filter((e) => e.type === "cash").reduce((s, e) => s + e.lotes, 0);
  const virtualLotes = entries.filter((e) => e.type === "virtual").reduce((s, e) => s + e.lotes, 0);

  return (
    <div style={{ background: "rgba(0,0,0,0.18)", borderRadius: 10, padding: 12 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <Avatar player={player} size={26} />
          <span style={{ color: C.card, fontWeight: 700, fontSize: 14.5 }}>{player.name}</span>
        </div>
        <div style={{ display: "flex", gap: 6 }}>
          <Badge tone="cash">{cashLotes} lotes · {money(cashLotes * game.loteValue)}</Badge>
          <Badge tone="virtual">{virtualLotes} lotes · {money(virtualLotes * game.loteValue)}</Badge>
        </div>
      </div>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <input type="number" min="1" style={{ ...inputStyle, width: 56, padding: "6px 8px" }} value={qtyCash} onChange={(e) => setQtyCash(e.target.value)} />
          <button onClick={() => onAdd(player.id, "cash", qtyCash)} style={{ background: C.cash, border: "none", color: "#fff", borderRadius: 8, padding: "7px 10px", display: "flex", alignItems: "center", gap: 5, cursor: "pointer", fontWeight: 700, fontSize: 12.5 }}>
            <Plus size={13} /> Cash
          </button>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <input type="number" min="1" style={{ ...inputStyle, width: 56, padding: "6px 8px" }} value={qtyVirtual} onChange={(e) => setQtyVirtual(e.target.value)} />
          <button onClick={() => onAdd(player.id, "virtual", qtyVirtual)} style={{ background: C.virtual, border: "none", color: "#fff", borderRadius: 8, padding: "7px 10px", display: "flex", alignItems: "center", gap: 5, cursor: "pointer", fontWeight: 700, fontSize: 12.5 }}>
            <Plus size={13} /> Virtual
          </button>
        </div>
      </div>
      {entries.length > 0 && (
        <div className="scrollbar-thin" style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 9, maxHeight: 70, overflowY: "auto" }}>
          {entries.slice().reverse().map((e) => (
            <span key={e.id} onClick={() => onRemove(e.id)} title="Quitar"
              style={{
                cursor: "pointer", fontSize: 10.5, ...monoFont, padding: "3px 7px", borderRadius: 6,
                background: e.type === "cash" ? "rgba(47,174,102,0.18)" : "rgba(139,107,240,0.18)",
                color: e.type === "cash" ? C.cash : C.virtual, border: `1px solid ${e.type === "cash" ? C.cashDeep : C.virtualDeep}`,
              }}>
              {e.lotes}× {money(e.amount)} ✕
            </span>
          ))}
        </div>
      )}
    </div>
  );
}

function DinnerSection({ game, players, update }) {
  const d = game.dinner;
  const setD = (patch) => update({ dinner: { ...d, ...patch } });
  const numPlayers = players.length || 1;

  return (
    <div style={{ marginTop: 6 }}>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        <Field label="Monto total de la cena">
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>

          </div>
        </Field>
        <Field label="Servicio de mesero (por jugador)">
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <input type="number" style={inputStyle} value={d.waiter} onChange={(e) => setD({ waiter: Number(e.target.value) || 0 })} />
            <span style={{ ...monoFont, fontSize: 12.5, color: "rgba(244,234,214,0.5)", whiteSpace: "nowrap" }}>{money(d.waiter)}</span>
          </div>
        </Field>
      </div>
      <div style={{ marginTop: 10 }}>
        <Field label="Cargo extra de alcohol (se suma a la cena de quienes bebieron)">
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <input type="number" style={inputStyle} value={d.alcoholFee} onChange={(e) => setD({ alcoholFee: Number(e.target.value) || 0 })} />
            <span style={{ ...monoFont, fontSize: 12.5, color: "rgba(244,234,214,0.5)", whiteSpace: "nowrap" }}>{money(d.alcoholFee)}</span>
          </div>
        </Field>
      </div>
      <div style={{ marginTop: 12, display: "grid", gap: 6 }}>
        {players.map((p) => {
          const alcohol = !!d.alcohol[p.id];
          const charge = d.total / numPlayers + d.waiter + (alcohol ? d.alcoholFee : 0);
          const paid = !!d.paid?.[p.id];
          const method = d.paymentMethod?.[p.id] || "fichas";
          return (
            <div key={p.id} style={{ background: "rgba(0,0,0,0.16)", borderRadius: 8, padding: "8px 10px" }}>

                  <Wine size={14} color={alcohol ? C.virtual : "rgba(244,234,214,0.3)"} style={{ flexShrink: 0 }} />
                  <span style={{ fontSize: 13, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{p.name}</span>
                </button>
                <span style={{ ...monoFont, fontSize: 13, color: "rgba(244,234,214,0.75)", whiteSpace: "nowrap" }}>{money(charge)}</span>
              </div>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginTop: 7 }}>

                  value={method}
                  onChange={(e) => setD({ paymentMethod: { ...d.paymentMethod, [p.id]: e.target.value } })}
                  style={{ ...inputStyle, appearance: "auto", padding: "5px 8px", fontSize: 12, width: "auto", flex: 1 }}
                >
                  <option value="fichas">Pago con fichas</option>
                  <option value="cash">Pago con cash</option>
                  <option value="mixto">Combinado (fichas + cash)</option>
                </select>
                <button onClick={() => setD({ paid: { ...d.paid, [p.id]: !paid } })}
                  style={{
                    display: "flex", alignItems: "center", gap: 6, background: paid ? "rgba(63,191,114,0.16)" : "rgba(0,0,0,0.2)",
                    border: `1px solid ${paid ? C.win : C.panelLine}`, borderRadius: 7, padding: "5px 9px",

                  }}>
                  <div style={{ width: 14, height: 14, borderRadius: 4, border: `1.5px solid ${paid ? C.win : "rgba(244,234,214,0.4)"}`, background: paid ? C.win : "transparent", display: "flex", alignItems: "center", justifyContent: "center" }}>
                    {paid && <Check size={10} color="#08251a" />}

              </div>
